    ctx.font = '11px ' + c('font-ui');
    cv.onclick = (e) => { const b = cv.getBoundingClientRect(), y = e.clientY - b.top; let best = rs[0]; for (const r of rs) if (Math.abs(Yt(r.mid) - y) < Math.abs(Yt(best.mid) - y)) best = r; o.onPick?.(best.id); };
  }

  function drawEchem(cv, o) {
    const g = setup(cv); if (!g) return;
    const { ctx, c, w, h: H } = g;
    const el = S.data.electrochemistry, rs = S.data.readings, off = S.offset;
    const tEnd = Math.max(rs.at(-1).window[1], el.last + off);
    const tStart = Math.min(0, el.first + off);
    const f = { l: 52, r: w - 14, t: 40, b: H - (o.paper ? 66 : 40) };
    const X = lin(tStart, tEnd, f.l, f.r);
    let vmn = Infinity, vmx = -Infinity; for (const r of el.rows) { vmn = Math.min(vmn, r[2]); vmx = Math.max(vmx, r[2]); }
    const Y = lin(vmn - .1, vmx + .15, f.b, f.t);
    // NMR windows
    for (const r of rs) {
      const a = X(r.window[0]), b = X(r.window[1]);
      const mark = o.mark?.[r.id];
      ctx.fillStyle = mark ? c(mark === 'blue-text' ? 'blue-soft' : mark === 'teal-text' ? 'teal-soft' : 'violet-soft') : c('wash');
      ctx.fillRect(a, f.t, b - a, f.b - f.t);
      ctx.fillStyle = mark ? c(mark) : c('violet-pale');
      ctx.fillRect(a, f.t - 16, b - a, 12);
      ctx.fillStyle = mark ? c('surface') : c('ink-2'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '600 9.5px ' + c('font-ui');
      if (b - a > 14) ctx.fillText(String(r.id), (a + b) / 2, f.t - 10);
    }
    ctx.font = '11px ' + c('font-ui');
    // paper-reported context
    if (o.paper) {
      const y1 = f.b + 28, y2 = f.b + 44;
      ctx.fillStyle = c('orange'); ctx.fillRect(X(1.5 * 3600), y1 - 5, X(2.5 * 3600) - X(1.5 * 3600), 10);
      ctx.fillStyle = c('orange-text'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('paper: transient metal peak, ~1.5–2.5 h', X(2.5 * 3600) + 6, y1);
      ctx.fillStyle = c('purple'); ctx.beginPath(); ctx.arc(X(4.5 * 3600), y2, 5, 0, 7); ctx.fill();
      ctx.fillStyle = c('purple-text'); ctx.fillText('paper: quasi-metallic Na (339 ppm), ~4.5 h', X(4.5 * 3600) + 8, y2);
    }
    const yv = ticks(vmn - .1, vmx + .15, 5);
    frame(g, f, ticks(tStart / 3600, tEnd / 3600, 8).map((v) => v * 3600), yv, X, Y, (v) => (v / 3600).toFixed(0), (v) => v.toFixed(1), o.paper ? '' : 'time from first NMR start (h)', 'cell potential (V)');
    if (o.paper) { ctx.fillStyle = c('ink-2'); ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.fillText('time from first NMR start (h)', f.r, f.b + 5); }
    ctx.save(); ctx.beginPath(); ctx.rect(f.l, f.t, f.r - f.l, f.b - f.t); ctx.clip();
    ctx.strokeStyle = c('blue-text'); ctx.lineWidth = 1.6;
    trace(ctx, el.rows.map((r) => r[0] + off), el.rows.map((r) => r[2]), X, Y, -Infinity, Infinity);
    ctx.restore();
    for (const r of rs) {
      const v = midpointVoltage(el, r.mid - off); if (v === null) continue;
      ctx.fillStyle = o.mark?.[r.id] ? c(o.mark[r.id]) : c('ink'); ctx.beginPath(); ctx.arc(X(r.mid), Y(v), o.mark?.[r.id] ? 4.5 : 3, 0, 7); ctx.fill();
    }
    ctx.fillStyle = c('ink-2'); ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText('NMR acquisition windows (audited start–end) ↓', f.l, f.t - 19);
    cv.onclick = (e) => { const b = cv.getBoundingClientRect(), x = e.clientX - b.left; const r = rs.find((q) => x >= X(q.window[0]) - 3 && x <= X(q.window[1]) + 3); if (r) o.onPick?.(r.id); };
    cv.onmousemove = (e) => {
      const b = cv.getBoundingClientRect(), x = e.clientX - b.left, t = tStart + (x - f.l) / (f.r - f.l) * (tEnd - tStart);
      const r = rs.find((q) => t >= q.window[0] && t <= q.window[1]); const v = midpointVoltage(el, t - off);
      cv.style.cursor = r ? 'pointer' : 'default';
      if (o.readout) o.readout.textContent = `t = ${h(t)} h · potential ${v === null ? '—' : v.toFixed(3) + ' V'}${r ? ` · inside NMR window #${r.id}` : ''}`;
    };
  }

  function drawAreas(cv, o) {
    const g = setup(cv); if (!g) return;
    const { ctx, c, w, h: H } = g;
    const rs = S.data.readings;
    const f = { l: 56, r: w - 14, t: 14, b: H - 34 };
    const tEnd = rs.at(-1).window[1];
    const X = lin(0, tEnd, f.l, f.r);
    let mn = 0, mx = 0; for (const r of rs) { mn = Math.min(mn, r.measurement.area - r.measurement.allowance); mx = Math.max(mx, r.measurement.area + r.measurement.allowance); }
    const pad = (mx - mn) * .06; const Y = lin(mn - pad, mx + pad, f.b, f.t);
    frame(g, f, ticks(0, tEnd / 3600, 8).map((v) => v * 3600), ticks((mn - pad) / 1e6, (mx + pad) / 1e6, 5).map((v) => v * 1e6), X, Y, (v) => (v / 3600).toFixed(0), (v) => (v / 1e6).toFixed(0), 'acquisition midpoint (h from first NMR start)', 'signed area (10⁶ a.u.·ppm)');
    ctx.strokeStyle = c('line-strong'); ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(f.l, Y(0)); ctx.lineTo(f.r, Y(0)); ctx.stroke(); ctx.setLineDash([]);
    if (o.state) { ctx.strokeStyle = c('orange'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(f.l, Y(o.state.value)); ctx.lineTo(f.r, Y(o.state.value)); ctx.stroke(); ctx.fillStyle = c('orange-text'); ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText(`twin state (#${o.state.acquisition})`, f.l + 4, Y(o.state.value) - 2); ctx.lineWidth = 1; }
    for (const r of rs) {
      const m = r.measurement, x = X(r.mid), mark = o.mark?.[r.id];
      ctx.strokeStyle = mark ? c(mark) : c('ink-2'); ctx.lineWidth = mark ? 2.2 : 1.2;
      ctx.beginPath(); ctx.moveTo(x, Y(m.area - m.allowance)); ctx.lineTo(x, Y(m.area + m.allowance)); ctx.stroke();
      for (const v of [m.area - m.allowance, m.area + m.allowance]) { ctx.beginPath(); ctx.moveTo(x - 4, Y(v)); ctx.lineTo(x + 4, Y(v)); ctx.stroke(); }
      ctx.fillStyle = det(r) ? (mark ? c(mark) : c('ink')) : c('surface');
      ctx.beginPath(); ctx.arc(x, Y(m.area), mark ? 5 : 4, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = mark ? c(mark) : c('muted'); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.font = (mark ? '700 ' : '') + '10px ' + c('font-ui');
      ctx.fillText('#' + r.id, x, Y(m.area + m.allowance) - 3); ctx.font = '11px ' + c('font-ui'); ctx.lineWidth = 1;
    }
    cv.onclick = (e) => { const b = cv.getBoundingClientRect(), x = e.clientX - b.left; let best = rs[0]; for (const r of rs) if (Math.abs(X(r.mid) - x) < Math.abs(X(best.mid) - x)) best = r; o.onPick?.(best.id); };
  }

  // Horizontal value ± allowance intervals on one axis (no probability shape is implied).
  function drawIntervals(cv, rows, o = {}) {
    const g = setup(cv); if (!g) return;
    const { ctx, c, w, h: H } = g;
    const f = { l: 170, r: w - 118, t: 12, b: H - 34 };
    let mn = 0, mx = 0; for (const r of rows) { mn = Math.min(mn, r.value - r.allowance); mx = Math.max(mx, r.value + r.allowance); }
    if (o.domain) [mn, mx] = o.domain;
    const pad = (mx - mn) * .08; const X = lin(mn - pad, mx + pad, f.l, f.r);
    const rowH = (f.b - f.t) / rows.length;
    const xt = ticks((mn - pad) / 1e6, (mx + pad) / 1e6, 6).map((v) => v * 1e6);
    frame(g, f, xt, [], X, null, (v) => (v / 1e6).toFixed(0), null, 'signed metal-region area (10⁶ a.u.·ppm) · bars = value ± method allowance');
    ctx.strokeStyle = c('line-strong'); ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(X(0), f.t); ctx.lineTo(X(0), f.b); ctx.stroke(); ctx.setLineDash([]);
    rows.forEach((r, i) => {
      const y = f.t + rowH * (i + .5);
      ctx.fillStyle = c('ink'); ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.font = '650 12px ' + c('font-ui');
      ctx.fillText(r.label, f.l - 10, y - (r.sub ? 7 : 0)); ctx.font = '11px ' + c('font-ui');
      if (r.sub) { ctx.fillStyle = c('muted'); ctx.fillText(r.sub, f.l - 10, y + 8); }
      if (r.ghost) ctx.globalAlpha = .35;
      ctx.fillStyle = c(r.soft); ctx.fillRect(X(r.value - r.allowance), y - 9, X(r.value + r.allowance) - X(r.value - r.allowance), 18);
      ctx.strokeStyle = c(r.color); ctx.lineWidth = 2; ctx.setLineDash(r.dash || []); ctx.strokeRect(X(r.value - r.allowance), y - 9, X(r.value + r.allowance) - X(r.value - r.allowance), 18); ctx.setLineDash([]);
      ctx.fillStyle = c(r.color); ctx.beginPath(); ctx.arc(X(r.value), y, 5, 0, 7); ctx.fill();
      ctx.fillStyle = c('ink-2'); ctx.textAlign = 'left'; ctx.fillText(`${Ms(r.value)} ± ${M(r.allowance)}`, X(r.value + r.allowance) + 6, y);
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    });
  }

  function drawBudget(cv, specs) {
    const g = setup(cv); if (!g) return;
    const { ctx, c, w, h: H } = g;
    const f = { l: 80, r: w - 20, t: 10, b: H - 34 };
    const max = Math.max(...specs.map((s) => s.measurement.allowance));
    const X = lin(0, max * 1.12, f.l, f.r);
    frame(g, f, ticks(0, max * 1.12 / 1e6, 6).map((v) => v * 1e6), [], X, null, (v) => (v / 1e6).toFixed(0), null, 'method allowance components (10⁶ a.u.·ppm)');
    const parts = [['noise', 'blue', 'sideband residual × width'], ['sideband', 'teal', 'sideband shift ±10 ppm'], ['phase', 'orange', 'phase rotation ±10°']];
    const rowH = (f.b - f.t) / specs.length;
    specs.forEach((s, i) => {
      const y = f.t + rowH * i + rowH * .25, hh = rowH * .5; let x0 = 0;
      ctx.fillStyle = c('ink'); ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.font = '650 12px ' + c('font-ui'); ctx.fillText('#' + s.id, f.l - 10, y + hh / 2); ctx.font = '11px ' + c('font-ui');
      for (const [k, col] of parts) { const v = s.measurement.uncertainty_components[k]; ctx.fillStyle = c(col); ctx.fillRect(X(x0), y, X(x0 + v) - X(x0), hh); x0 += v; }
      ctx.fillStyle = c('ink-2'); ctx.textAlign = 'left'; ctx.fillText('total ' + M(s.measurement.allowance), X(x0) + 6, y + hh / 2);
    });
  }

  /* ================================================================ shared visual blocks */
  let draws = [];
  let named = {};
  const later = (fn, key) => { draws.push(fn); if (key) named[key] = fn; };
  function redraw() { for (const fn of draws) try { fn(); } catch (e) { console.error(e); } }
  function redrawOnly(...keys) { for (const k of keys) try { named[k]?.(); } catch (e) { console.error(e); } }

  function markFor() {
    const m = {}; if (!S.study) return m;
    m[S.study.base.id] = 'blue-text'; m[S.study.follow.id] = 'teal-text';
    return m;
  }
  function pickAcq(id) { S.selected = id; render(); }

  function needData(extra = '') {
    return `<div class="missing card"><svg width="54" height="54" viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="12" width="36" height="28" rx="5" fill="var(--wash)" stroke="var(--ink)" stroke-width="2.5"/><path d="M6 18h14l4-6h18" fill="none" stroke="var(--ink)" stroke-width="2.5"/></svg>
      <b>载入 Figure 5 数据后才能看到这一步</b>
      <p>选择解压后的 <code>Figure_5</code> 文件夹（16 个 <code>Na_fullSpectrum_60</code>–<code>75</code> 文件夹和 <code>Electrochemistry_30mAhg-1.txt_1</code>），或包含 Figure_5/6/7 的上级文件夹。文件只在本浏览器中读取。</p>
      <button class="btn primary" type="button" data-load>载入数据</button>${extra}</div>`;
  }

  function stackBlock(id) {
    const st = S.stack;
    const segs = (key, opts) => `<span class="seg" role="group">${opts.map(([v, l]) => `<button type="button" data-stack="${key}" data-v="${v}" aria-pressed="${st[key] === v}">${l}</button>`).join('')}</span>`;
    later(() => {
      const cv = document.getElementById(id); if (!cv) return;
      const o = { range: RANGES[st.range], mark: { ...markFor(), [S.selected]: markFor()[S.selected] || 'violet-deep' }, readout: document.getElementById(id + '-ro'), onPick: pickAcq, contrast: st.contrast, gain: st.gain };
      st.mode === 'heat' ? drawHeat(cv, o) : drawStack(cv, o);
    }, 'stack:' + id);
    return `<div class="row">${segs('mode', [['heat', '2-D map'], ['stack', 'Stacked']])} ${segs('range', [['full', 'Full'], ['quasi', 'Quasi-metallic'], ['metal', 'Metal']])}
      <label class="ctl">${st.mode === 'heat' ? 'contrast' : 'gain'} <input type="range" min="${st.mode === 'heat' ? 2 : 0.5}" max="${st.mode === 'heat' ? 200 : 12}" step="${st.mode === 'heat' ? 1 : 0.5}" value="${st.mode === 'heat' ? st.contrast : st.gain}" data-stack-slider="${id}"></label></div>
      <canvas class="chart" id="${id}" style="height:${st.mode === 'heat' ? 380 : 440}px" role="img" aria-label="The 16 ²³Na spectra of Figure 5 against time"></canvas>
      <div class="legend"><span><i style="background:var(--orange)"></i>positive intensity</span><span><i style="background:var(--blue)"></i>negative intensity</span><span><i style="background:var(--purple-soft);border:1px dashed var(--purple-text)"></i>quasi-metallic 150–900 ppm</span><span><i style="background:var(--orange-soft);border:1px dashed var(--orange-text)"></i>metal 1000–1250 ppm</span><span>${ep('MEASURED')} spectra as saved by the authors (<code>pdata/2</code>)</span></div>
      <div class="readout" id="${id}-ro">Hover the ${st.mode === 'heat' ? 'map' : 'traces'} to read values; click a row to select an acquisition.</div>`;
  }

  function echemBlock(id, paper = true) {
    later(() => { const cv = document.getElementById(id); if (cv) drawEchem(cv, { mark: { ...markFor(), [S.selected]: markFor()[S.selected] || 'violet-deep' }, paper, readout: document.getElementById(id + '-ro'), onPick: pickAcq }); });
    return `<canvas class="chart" id="${id}" style="height:${paper ? 320 : 270}px" role="img" aria-label="Cell potential against time with the 16 NMR acquisition windows"></canvas>
      <div class="legend"><span><i style="background:var(--blue-text)"></i>cell potential ${ep('MEASURED')}</span><span><i style="background:var(--violet-pale)"></i>NMR window ${ep('MEASURED')} audit times</span><span>time alignment of the two instruments ${ep('INFERRED')} (offset ${S.offset} s)</span>${paper ? `<span>${ep('REPORTED')} milestones from the paper</span>` : ''}</div>
      <div class="readout" id="${id}-ro">Hover for the potential at a time; click a window to select that acquisition.</div>`;
  }

  function oneNumberBlock(id, spec) {
    const m = spec.measurement;
    later(() => {
      const cv = document.getElementById(id); if (!cv) return;
      drawSpectra(cv, { range: RANGES.metal, traces: [{ x: spec.x, y: spec.real, color: 'line-strong', width: 1.2, dash: [4, 3], label: 'stored' }, { x: spec.x, y: spec.corrected, color: 'teal-text', width: 1.8, label: 'corrected' }],
        bands: [{ range: method.sidebands_ppm[0], color: 'surface-2', label: 'sideband' }, { range: method.sidebands_ppm[1], color: 'surface-2', label: 'sideband' }, { range: method.signal_window_ppm, color: 'wash', label: 'integration window 1020–1150 ppm' }],
        fill: { x: spec.x, y: spec.corrected, range: method.signal_window_ppm, color: 'teal' }, readout: document.getElementById(id + '-ro') });
    });
    return `<canvas class="chart" id="${id}" style="height:280px" role="img" aria-label="Metal region of acquisition ${spec.id} with the background line and the integrated area"></canvas>
      <div class="legend"><span><i style="background:var(--line-strong)"></i>stored spectrum (pdata/2) ${ep('MEASURED')}</span><span><i style="background:var(--teal-text)"></i>after our linear sideband background ${ep('DERIVED')}</span><span><i style="background:var(--teal);opacity:.5"></i>signed area</span></div>
      <div class="readout" id="${id}-ro">#${spec.id}: area ${pm(m.area, m.allowance)} × 10⁶ a.u.·ppm · peak at ${m.peak_ppm.toFixed(0)} ppm · peak / residual SD = ${m.peak_to_residual_sd.toFixed(1)} · ${m.detected ? 'resolved under the rule' : 'not resolved under the rule'}</div>`;
  }

  function acqChips(sel, attr = 'data-sel') {
    return `<div class="row" role="group" aria-label="Select acquisition">${S.data.readings.map((r) => `<button type="button" class="btn small" ${attr}="${r.id}" aria-pressed="${r.id === sel}">#${r.id}</button>`).join('')}</div>`;
  }

  function passport(spec, gate, isFollow) {
    const m = spec.measurement;
    const checks = isFollow ? gate.checks : gate.checks.filter((c) => c.name === 'baseline_signal');
    const st = isFollow ? gate.status : checks[0].status;
    const fmt = (ck) => typeof ck.value === 'boolean' ? (ck.value ? 'met' : 'not met') : ck.unit === unit ? `${Ms(ck.value)} × 10⁶ ${unit}` : `${+Number(ck.value).toFixed(2)} ${ck.unit === '1' ? '' : ck.unit}`;
    return `<article class="passport"><header><div><h3>Metal-region signal · #${spec.id}</h3><p class="small">${isFollow ? 'follow-up' : 'baseline'} · window ${h(spec.window[0])}–${h(spec.window[1])} h · ${esc(packetId(spec))}</p></div>${status(st)}</header>
      <div class="big-num">${pm(m.area, m.allowance)} <span class="small">× 10⁶ ${unit}</span></div>
      <dl class="kv"><dt>Where it came from</dt><dd><code>${esc(spec.paths['1r'])}</code></dd>
      <dt>What kind of number</dt><dd>${ep('MEASURED')} raw source, ${ep('DERIVED')} value, ${ep('INFERRED')} decision</dd>
      <dt>The ± means</dt><dd>method sensitivity allowance (sum of three stress tests); no calibrated probability coverage</dd>
      <dt>What the twin does</dt><dd>${st === 'FAIL' ? 'Refused. The state stays as it is.' : st === 'WARN' ? 'Used only after someone explicitly accepts each warning.' : 'Used.'}</dd></dl>
      <h4 style="margin:10px 0 2px;font-size:12.5px">Checks</h4><ul class="checks">${checks.map((ck) => `<li>${status(ck.status)}<span><b>${esc(checkLabels[ck.name])}</b><span class="small">${esc(fmt(ck))} · ${esc(ck.reason)}</span></span>${trk(ck.owner)}</li>`).join('')}</ul></article>`;
  }

  function rotated(spec) {
    const th = S.phaseDeg * Math.PI / 180;
    const rot = spec.corrected.map((v, i) => v * Math.cos(th) - spec.imagCorrected[i] * Math.sin(th));
    const bins = spec.x.map((p, i) => i).filter((i) => spec.x[i] >= method.signal_window_ppm[0] && spec.x[i] <= method.signal_window_ppm[1]);
    const area = bins.slice(1).reduce((s, i) => s + (rot[i] + rot[i - 1]) * Math.abs(spec.x[i] - spec.x[i - 1]) / 2, 0);
    return { rot, area };
  }
  function phaseText(spec, area) {
    const d = area - spec.measurement.area;
    return `Area at ${S.phaseDeg}°: <b>${Ms(area)}</b> vs ${Ms(spec.measurement.area)} × 10⁶ ${unit} at the stored phase. Change ${Ms(d)}, which is ${Math.abs(d) > spec.measurement.allowance ? '<b>larger</b>' : 'smaller'} than the allowance ${M(spec.measurement.allowance)}.`;
  }

  function pairButtons() {
    const pairs = [[61, 63], [60, 63], [62, 63]];
    return `<div class="packet-list" role="group" aria-label="Comparison">${pairs.map(([a, b]) => { const g = evaluate(byId(a), byId(b), S.thresholds); const on = S.study.base.id === a && S.study.follow.id === b; return `<button type="button" data-pair="${a},${b}" aria-pressed="${on}">${status(g.status)} ${pair(a, b)}</button>`; }).join('')}
      <label class="ctl">or choose <select data-pick="base" aria-label="Baseline">${S.data.readings.map((r) => `<option ${r.id === S.study.base.id ? 'selected' : ''}>${r.id}</option>`).join('')}</select> → <select data-pick="follow" aria-label="Follow-up">${S.data.readings.map((r) => `<option ${r.id === S.study.follow.id ? 'selected' : ''}>${r.id}</option>`).join('')}</select></label></div>`;
  }

  function twinRows(step = 4) {
    const { base, follow, gate, event } = S.study;
    const prior = event?.before ?? currentState();
    const ev = stateFor(follow);
    const rows = [{ label: 'Belief before', sub: `state = #${prior.acquisition}`, value: prior.value, allowance: prior.allowance, color: 'blue-text', soft: 'blue-soft' }];
    if (step >= 2) rows.push({ label: 'New evidence', sub: `#${follow.id} · gate ${gate.status}`, value: ev.value, allowance: ev.allowance, color: gate.status === 'FAIL' ? 'fail' : 'teal-text', soft: gate.status === 'FAIL' ? 'fail-bg' : 'teal-soft', dash: gate.status === 'PASS' ? [] : [5, 3] });
    if (step >= 4) {
      const after = event ? event.after : null;
      if (after) rows.push({ label: 'Belief after', sub: event.action === 'rejected' ? 'rejected: unchanged' : decisionLabel[event.action].toLowerCase(), value: after.value, allowance: after.allowance, color: 'orange-text', soft: 'orange-soft' });
      else if (gate.status === 'FAIL') rows.push({ label: 'Belief after', sub: 'FAIL: cannot change', value: prior.value, allowance: prior.allowance, color: 'orange-text', soft: 'orange-soft' });
      else rows.push({ label: 'Belief after (if accepted)', sub: 'pending review', value: ev.value, allowance: ev.allowance, color: 'orange-text', soft: 'orange-soft', ghost: true, dash: [4, 3] });
    }
    return rows;
  }

  function decideBlock() {
    const { gate, event } = S.study;
    const reasons = gate.checks.filter((c) => c.status !== 'PASS');
    if (event) return `<div class="decide"><b>${status(event.gate.status)} Event ${event.event_number}: ${decisionLabel[event.action]}.</b><span class="small">State ${pair(event.before.acquisition, event.after.acquisition)} · recorded ${esc(event.recorded_at_utc)}</span><div class="row"><button class="btn small" type="button" data-act="newreview">开始新的审查</button><button class="btn small ghost" type="button" data-act="reset">重置孪生体和审计日志</button></div></div>`;
    return `<div class="decide"><b>${status(gate.status)} ${pair(S.study.base.id, S.study.follow.id)}: ${gate.status === 'FAIL' ? 'the gate refuses this evidence' : gate.status === 'WARN' ? 'usable only with explicit acceptance' : 'all checks pass'}</b>
      ${reasons.map((c, i) => `<label>${gate.status === 'WARN' ? `<input type="checkbox" data-ack="${i}">` : '•'} <span><b>${esc(checkLabels[c.name])}</b> (${c.status}, ${c.owner}): ${esc(c.reason)}</span></label>`).join('')}
      <div class="row">${gate.status === 'FAIL' ? '<button class="btn primary" type="button" disabled title="FAIL cannot change the state">应用更新（已阻止）</button>' : `<button class="btn primary" type="button" data-act="accept" ${gate.status === 'WARN' ? 'disabled' : ''}>${gate.status === 'WARN' ? '接受警告并应用' : '应用更新'}</button>`}
      <button class="btn" type="button" data-act="reject">记录拒绝</button></div>
      <span class="small">${esc(policy)}</span></div>`;
  }

  function logBlock() {

  const STOP_TEXT = {
    1: { lead: '谱上的每个点都是一个数：在某一频率上收到多少 ²³Na 信号。频率（化学位移，单位 ppm）说明钠处在什么环境里。', body: ['液态电解液中的钠离子在 0 ppm 附近形成大峰。存进硬碳负极的钠随着填充孔隙、越来越接近金属态，位移升高：这是准金属区，约 150–900 ppm。表面上的金属钠位移更大，约 1000–1250 ppm，原因是传导电子带来的 Knight 位移。', '这张谱是作者保存的处理结果（<code>pdata/2</code>），我们按原样读取。'], tryit: '把鼠标移到放大图上。然后在 #60、#63、#69 之间切换。1000 ppm 以上在哪里出现信号？', deeper: '<p>位移轴：ppm = OFFSET − index × SW_p / (SF × SI)，取自 <code>procs</code>。强度：存储整数 × 2^NC_proc。Bray 等报告了一个瞬时金属峰，从约 1050 ppm 移到 1115 ppm；充电后期在约 339 ppm 出现准金属钠（SI 表 6）。</p>' },
    2: { lead: '谱仪为每次采集写一个文件夹，里面有原始信号、全部设置、记录运行时间的审计日志，以及处理后的谱。', body: ['原始信号是 FID（自由感应衰减），即自旋发出的、随时间衰减的射频回波。处理后的谱 <code>1r</code> 是 FID 经加权、相位校正和基线校正后的傅里叶变换，参数由作者选择。', '本页的每个数都能追溯到这六个文件。比较两次采集前，Explorer 先检查设置是否一致。'], tryit: '比较 #61 和 #63。哪个存储的参数不同？（看 PHC0 和 PHC1。）', deeper: '<p>团队决定：16 张谱全部使用 <code>pdata/2</code>，因为 <code>pdata/1</code> 的处理前后不一致（#61、#65）。我们不重新处理 FID。限制：<code>pdata/2</code> 使用自动 5 阶多项式基线（ABSG = 5），可能压低宽信号。</p>' },
    3: { lead: '首次充电期间，电池被测了 16 次，每次约 30 分钟。把这些谱按时间排在一起，化学变化就能看出来。', body: ['从上（充电开始）往下读这张图。颜色表示信号强弱。电解液峰一直在 0 ppm 附近。请注意左边的金属区和中间的准金属区。', '这与论文 Figure 5 是同一类图，由你本地的数据文件直接画出。'], tryit: '切换到“Metal”并提高对比度。哪几行在 1050–1115 ppm 附近出现特征？再试试堆叠视图，或到 <a href="#viz">可视化</a> 里像播放影片一样播放整个序列。', deeper: '<p>颜色使用 asinh 标度，使弱特征在强电解液峰旁也能看见；对比度滑块只改变标度的拐点，不改变数据。每行的高度等于审计到的采集时间窗；行之间的空白是两次采集之间约 5 分钟的间隔。</p>' },
    4: { lead: '电池测试仪和 NMR 谱仪各有自己的时钟。要回答“这张谱采集时电压是多少”，必须先对齐两条时间轴。', body: ['NMR 时间窗来自审计日志（实测的开始和结束时间，UTC）。测试仪文件只有经过的秒数。我们假设测试仪在 #60 开始时启动，这是推断，不是测量。', '每个点是 NMR 时间窗中点的电压。一个时间窗长 30 分钟，所以一张谱是对一段电压范围的平均。'], tryit: '找出论文报告瞬时金属峰的时间（1.5–2.5 h）对应的时间窗。是哪几次采集？', deeper: '<p>电化学文件的三列根据数值量级和 Figure 5c 推断为时间（s）、电流（A）和电压（V）。在 Workbench 中可以修改时钟偏移；NMR 状态更新不依赖这个偏移。</p>' },
    5: { lead: '孪生体无法保存整张谱。我们把金属区归结为一个数：1020 到 1150 ppm 之间的带符号面积。', body: ['先在两侧两个安静的频带（940–980 和 1190–1230 ppm）上拟合一条直线背景并扣除，再对窗口内求面积。没有真实峰时，面积可以是负数。', '只有同时满足以下条件，信号才算“已分辨”：峰在窗口内部，峰高至少是背景散布的 5 倍，并且面积大于它自己的容差。'], tryit: '先选 #61，再选 #63。哪一个满足“已分辨”规则？为什么 #61 的面积是负的？', deeper: '<p>积分窗口 1020–1150 ppm 留有余量地覆盖了论文报告的两个峰位（≈1050 和 ≈1115 ppm）。5 倍系数、背景带和窗口都是团队的探索性选择，没有检测限研究支持。</p>' },
    6: { lead: '没有不确定度的数无法比较。我们没有重复测量，所以通过“推一推方法”来看这个数会变多少。', body: ['容差由三项压力测试组成：背景带的散布乘以窗口宽度；把每个背景带移动 ±10 ppm；把存储的相位旋转 ±10°。容差是三项之和。', '这是方法敏感性容差，不是实测的不确定度。它的概率覆盖未知，每张卡片上都写明了这一点。'], tryit: '拖动相位滑块。相位误差达到多少度时，#63 的面积变化会超过它的容差？', deeper: '<p>相位旋转：校正后实部 × cos θ − 校正后虚部 × sin θ。相位项很重要，因为 #61 和 #63 保存时的相位不同（PHC0 1.57° 对 −124.8°，PHC1 144.8° 对 318.4°）。</p>' },
    7: { lead: '一个数在改变孪生体之前，要装进证据包（evidence packet）：说明它是什么、来自哪里、有多可靠、通过了哪些检查。', body: ['七项检查比较两张谱，每项检查都有负责的赛道。最差的一项决定结果：PASS 直接使用；WARN 需要有人逐条明确接受；FAIL 被拒绝。', '默认比较 #61 → #63 得到 WARN，原因有两个：基线谱的信号未分辨，存储的相位不同。如果用 #60 或 #62 作参考，增量太小，闸门给出 FAIL。'], tryit: '依次打开三个证据包。哪个参考给出 FAIL？是哪项检查失败？', deeper: '<p>证据包遵循挑战赛 schema v1.0（StarterPack <code>evidence_packet_v1.0.schema.json</code>）。原始来源：MEASURED。面积：DERIVED。闸门决定：INFERRED。源文件摘要记为不可用（null）。</p>' },
    8: { lead: '这里的数字孪生不是电池的 3D 模型，而是这颗电池某一个量的当前最佳估计，带有容差，只能被通过闸门的证据改变。', body: ['策略：最近一次被接受的观测成为状态。WARN 更新需要明确接受；FAIL 永远不能改变状态；拒绝时状态保持不变。每个决定都会写进审计日志，同时记录闸门结果和所用的时钟对齐。', '对 #61 → #63：如果你接受这两条警告，孪生体就从一个负的、未分辨的面积，移动到一个已分辨的正面积。'], tryit: '走到第 4 步，勾选两条警告并应用。然后选择 #60 → #63，再试着应用。', deeper: '<p>孪生体不对证据做平均，因为容差没有概率含义；贝叶斯或卡尔曼更新需要校准过的方差，这列为后续工作。条形表示数值 ± 容差，不代表任何分布形状。</p>' },
    9: { lead: '孪生体不为电池下结论。它提出下一次测量，使当前状态背后的疑问减少得最多。', body: ['两条警告指向同一个解决办法：在固定相位下重复测量后续谱，并让 NMR 和测试仪共用一个触发信号。充电开始前采一张宽带谱，可以得到真正的参考。', '电池内部的电压预测不在这次更新之内；如果以后展示，会作为单独的分析标注。'], tryit: '移动情景滑块。容差要大多少，#61 → #63 的更新就不再成立？', deeper: '<p>结论只到此为止：同一颗电池内部，一个相对的 ²³Na 谱信号发生了变化。钠的质量、沉积形貌、健康状态和安全性需要独立且经过校准的测量。</p>' }
  };

  function renderTour(el, n) {
    const s = STOPS[n - 1], t = STOP_TEXT[n];
    el.innerHTML = `<nav class="rail" aria-label="Tour stops"><ol>${STOPS.map((x, i) => `<li><a href="#tour/${i + 1}" class="rail-stop ${x.track}" ${i + 1 === n ? 'aria-current="step"' : ''}><span class="path-n">${i + 1}</span><span class="rail-t">${x.short}</span></a></li>`).join('')}</ol></nav>
      <p class="example-band"><b>数据：</b>一颗钠离子全电池，30 mA g⁻¹ 首次充电，16 张工况 ²³Na 谱（Bray 等 2020，Fig. 5）。当前比较：<b>${S.study ? pair(S.study.base.id, S.study.follow.id) : '#61 → #63（载入后）'}</b>。</p>
      <div class="stop ${s.track}"><div class="stop-visual">${stopVisual(n)}</div>
      <div class="stop-text"><p class="stop-meta"><span class="path-n ${s.track}" style="width:28px;height:28px;font-size:12px">${n}</span> 第 ${n} / 9 站 · ${trackName[s.track]}（${s.track}）：${trackQ[s.track]}</p>
      <h2>${s.title}</h2><p class="stop-lead">${t.lead}</p>${t.body.map((p) => `<p>${p}</p>`).join('')}
      <div class="try"><b>试一试。</b> ${t.tryit}</div><details class="deeper"><summary>深入了解</summary>${t.deeper}</details></div></div>
      <nav class="stop-nav">${n > 1 ? `<a class="btn" href="#tour/${n - 1}">上一站：${STOPS[n - 2].short}</a>` : '<a class="btn" href="#home">回到开始</a>'}${n < 9 ? `<a class="btn primary" href="#tour/${n + 1}">下一站：${STOPS[n].short}</a>` : '<a class="btn primary" href="#work/spectra">打开工作台</a>'}</nav>`;
  }

  /* ================================================================ workbench */
  const WTABS = [['spectra', '谱', 'blue'], ['time', '时间与电压', 'purple'], ['evidence', '证据与闸门', 'teal'], ['twin', '孪生与下一步', 'orange'], ['provenance', '溯源与导出', 'violet-deep']];

  function treeHtml() {
    if (!S.data) return '<p class="small">No data files loaded.</p>';
    const files = ['fid', 'acqus', 'audita.txt', 'procs', '1r', '1i'];
    return `<button class="tree-row folder" type="button"><span class="ico">▾</span><span class="lbl">Figure_5</span></button><div class="tree-children">
      ${S.data.readings.map((r) => { const open = r.id === S.selected; const mk = markFor()[r.id]; return `<button class="tree-row folder" type="button" data-sel="${r.id}" aria-selected="${open && !S.inspectFile}"><span class="ico">${open ? '▾' : '▸'}</span><span class="lbl">Na_fullSpectrum_${r.id}</span>${mk ? `<span class="chip ${mk === 'blue-text' ? 'INFO' : 'PASS'}">${mk === 'blue-text' ? 'base' : 'follow'}</span>` : ''}${r.measurement.detected ? '<span class="small" title="resolved">●</span>' : '<span class="small" title="not resolved">○</span>'}</button>
        ${open ? `<div class="tree-children">${files.map((f) => `<button class="tree-row" type="button" data-file="${f}" aria-selected="${S.inspectFile === f}"><span class="ico">${f === 'fid' ? '∿' : f === '1r' || f === '1i' ? '≋' : '≡'}</span><span class="lbl">${['procs', '1r', '1i'].includes(f) ? 'pdata/2/' : ''}${f}</span></button>`).join('')}</div>` : ''}`; }).join('')}
      <button class="tree-row" type="button" data-file="echem"><span class="ico">⌁</span><span class="lbl">${esc(chemistryFile)}</span></button></div>`;
  }

  function inspectorHtml() {
    if (!S.data) return '<p class="small">Load the Figure_5 folder, then select an acquisition or file.</p>';
    if (S.inspectFile === 'echem') {
      const e = S.data.electrochemistry;
      return `<div class="card"><h3>Electrochemistry ${ep('MEASURED')}</h3><dl class="kv"><dt>path</dt><dd><code>${esc(e.path)}</code></dd><dt>rows</dt><dd>${e.rows.length.toLocaleString('en')}</dd><dt>time span</dt><dd>${e.first} – ${e.last} s (${h(e.last)} h)</dd><dt>columns</dt><dd>time (s), current (A), potential (V) ${ep('INFERRED')}</dd><dt>clock</dt><dd>own elapsed time; zero placed at ${S.offset} s on the NMR clock ${ep('INFERRED')}</dd></dl></div>`;
    }
    const r = byId(S.selected), m = r.measurement;
    const el = S.data.electrochemistry, v = midpointVoltage(el, r.mid - S.offset);
    const fileCard = S.inspectFile ? `<div class="card cyan"><h3><code>${esc(S.inspectFile)}</code> ${ep('MEASURED')}</h3><dl class="kv"><dt>path</dt><dd><code>${esc(r.paths[S.inspectFile])}</code></dd><dt>size</dt><dd>${(r.sizes[S.inspectFile] ?? 0).toLocaleString('en')} bytes</dd><dt>role</dt><dd>${{ fid: 'raw time-domain signal (not reprocessed)', acqus: 'acquisition parameters; DATE checked against audit end (≤ 1 s)', 'audita.txt': 'audited start and end time of this acquisition', procs: 'authors’ processing parameters for pdata/2', '1r': 'processed real spectrum: source of the area', '1i': 'processed imaginary spectrum: used for the phase stress test' }[S.inspectFile]}</dd></dl></div>` : '';
    later(() => { const cv = $('#insp-mini'); if (cv) drawSpectra(cv, { range: RANGES.metal, traces: [{ x: r.x, y: r.corrected, color: 'teal-text', width: 1.5 }], bands: [{ range: method.signal_window_ppm, color: 'wash' }] }); });
    return `<div class="card"><h3>Acquisition #${r.id} ${ep('MEASURED')}</h3><dl class="kv"><dt>window</dt><dd>${h(r.window[0])} – ${h(r.window[1])} h (midpoint ${h(r.mid)} h)</dd><dt>UTC</dt><dd>${iso(r.timing.start).slice(11, 19)} – ${iso(r.timing.end).slice(11, 19)}, ${iso(r.timing.start).slice(0, 10)}</dd><dt>potential at midpoint</dt><dd>${v === null ? '—' : v.toFixed(3) + ' V'} ${ep('INFERRED')}</dd><dt>stored phase</dt><dd>PHC0 ${esc(r.processing.PHC0)}°, PHC1 ${esc(r.processing.PHC1)}°</dd></dl></div>
      <div class="card"><h3>Metal-region signal ${ep('DERIVED')}</h3><div class="big">${pm(m.area, m.allowance)}</div><p class="small">× 10⁶ ${unit} · peak ${m.peak_ppm.toFixed(0)} ppm · peak/SD ${m.peak_to_residual_sd.toFixed(1)} · ${m.detected ? 'resolved' : 'not resolved'}</p>
      <canvas class="chart" id="insp-mini" style="height:130px" role="img" aria-label="Corrected metal region"></canvas>
      <div class="row" style="margin-top:8px"><button class="btn small" type="button" data-setbase="${r.id}">Use as baseline</button><button class="btn small" type="button" data-setfollow="${r.id}">Use as follow-up</button></div></div>${fileCard}`;
  }

  function workTab(tab) {
    if (!S.data) return needData();
    const { base, follow, gate } = S.study;
    const sel = byId(S.selected);
    switch (tab) {
      case 'spectra': {
        later(() => { const cv = $('#w-ov'); if (cv) drawSpectra(cv, { range: S.stack.range === 'full' ? [-650, 1730] : RANGES[S.stack.range], regions: true, readout: $('#w-ov-ro'), traces: [{ x: base.x, y: base.real, color: 'blue-text', label: '#' + base.id }, { x: follow.x, y: follow.real, color: 'teal-text', label: '#' + follow.id }, ...(sel !== base && sel !== follow ? [{ x: sel.x, y: sel.real, color: 'violet-deep', label: '#' + sel.id, dash: [4, 3] }] : [])] }); });
        return `<div class="card"><h3>${trk('QE')} 16 张谱随时间变化 ${ep('MEASURED')}</h3>${stackBlock('w-st')}</div>
          <div class="card"><h3>${trk('QE')} Overlay: baseline #${base.id}, follow-up #${follow.id}${sel !== base && sel !== follow ? `, selected #${sel.id}` : ''}</h3><canvas class="chart" id="w-ov" style="height:260px" role="img" aria-label="Overlay of the compared spectra"></canvas><div class="readout" id="w-ov-ro"></div></div>`;
      }
      case 'time': {
        later(() => { const cv = $('#w-ar'); if (cv) drawAreas(cv, { mark: markFor(), state: currentState(), onPick: pickAcq }); });
        return `<div class="card"><h3>${trk('DS')} 电化学与 NMR 时间窗</h3><form class="row" data-offset><label class="ctl">cycler zero on the NMR clock (s) <input type="number" step="any" value="${S.offset}" name="off" style="width:110px"></label><button class="btn small" type="submit">Apply</button><span class="small">Default 0: the cycler starts with #60 ${ep('INFERRED')}</span></form>${echemBlock('w-ec')}</div>
          <div class="card"><h3>${trk('QE')} 金属区面积随时间变化 ${ep('DERIVED')}</h3><canvas class="chart" id="w-ar" style="height:240px" role="img" aria-label="Area with allowance per acquisition"></canvas></div>
          <div class="card"><h3>全部 16 个时间窗</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>start UTC</th><th class="num">window (h)</th><th class="num">midpoint (h)</th><th class="num">potential (V)</th><th class="num">area ± allowance (10⁶)</th><th>resolved</th></tr></thead><tbody>
          ${S.data.readings.map((r) => { const a = alignment(S.data.electrochemistry, r, S.offset); return `<tr class="clickable ${r.id === S.selected ? 'sel' : ''}" data-sel="${r.id}"><td>${r.id}</td><td>${iso(r.timing.start).slice(11, 19)}</td><td class="num">${h(r.window[0])}–${h(r.window[1])}</td><td class="num">${h(r.mid)}</td><td class="num">${a.midpoint_voltage_v === null ? '—' : a.midpoint_voltage_v.toFixed(3)}</td><td class="num">${pm(r.measurement.area, r.measurement.allowance)}</td><td>${r.measurement.detected ? 'yes' : 'no'}</td></tr>`; }).join('')}</tbody></table></div></div>`;
      }
      case 'evidence': {
        later(() => { const cv = $('#w-bud'); if (cv) drawBudget(cv, [base, follow]); });
        later(() => { const cv = $('#w-one'); if (cv) drawSpectra(cv, { range: RANGES.metal, traces: [{ x: base.x, y: base.corrected, color: 'blue-text', label: '#' + base.id }, { x: follow.x, y: follow.corrected, color: 'teal-text', label: '#' + follow.id }], bands: [{ range: method.sidebands_ppm[0], color: 'surface-2', label: 'sideband' }, { range: method.sidebands_ppm[1], color: 'surface-2', label: 'sideband' }, { range: method.signal_window_ppm, color: 'wash', label: '1020–1150 ppm' }], readout: $('#w-one-ro') }); });
        return `${pairButtons()}<div class="card"><h3>${trk('QE')} 测量卡 ${ep('DERIVED')}</h3><canvas class="chart" id="w-one" style="height:230px" role="img" aria-label="Corrected metal region of both spectra"></canvas><div class="readout" id="w-one-ro"></div>
          <p class="small">Observation model: signed area of the stored ²³Na spectrum (pdata/2 × 2^NC_proc) between 1020 and 1150 ppm, after a straight-line background fitted to 940–980 and 1190–1230 ppm. Units a.u.·ppm; relative within this cell. Fails when phase or background change, or when no peak is present.</p></div>
          <div class="grid2">${passport(base, gate, false)}${passport(follow, gate, true)}</div>
          <div class="card"><h3>${trk('PM')} 不确定度卡 ${ep('DERIVED')}</h3><canvas class="chart" id="w-bud" style="height:140px" role="img" aria-label="Allowance budget"></canvas>
          <div class="tbl-wrap"><table class="tbl"><thead><tr><th>component (10⁶ ${unit})</th><th class="num">#${base.id}</th><th class="num">#${follow.id}</th></tr></thead><tbody>${[['noise', 'sideband residual × width'], ['sideband', 'sideband shift ±10 ppm'], ['phase', 'phase rotation ±10°']].map(([k, l]) => `<tr><td>${l}</td><td class="num">${M(base.measurement.uncertainty_components[k])}</td><td class="num">${M(follow.measurement.uncertainty_components[k])}</td></tr>`).join('')}<tr><td><b>allowance</b></td><td class="num"><b>${M(base.measurement.allowance)}</b></td><td class="num"><b>${M(follow.measurement.allowance)}</b></td></tr></tbody></table></div>
          <p class="small">Calibration status: none. Repeatability evidence: none in the source. Coverage: not established. Dominant term: ${['noise', 'sideband', 'phase'].reduce((a, k) => follow.measurement.uncertainty_components[k] > follow.measurement.uncertainty_components[a] ? k : a, 'noise')} (follow-up).</p></div>
          <div class="card"><h3>${trk('DT')} 竞争性解释</h3><p>(1) Sodium metal forms on the anode and its peak enters the window. (2) The stored phase differs between #${base.id} and #${follow.id} and rotates part of the dispersive signal into the real area. (3) Residual background left by the automatic baseline differs between spectra. The data cannot separate (1) from (2) and (3) without a matched repeat. Figure 6 shows effect (3) directly: see Visualize, section 3.</p>${competingTable()}</div>
          ${thresholdsBlock()}${playgroundBlock()}`;
      }
      case 'twin': {
        later(() => { const cv = $('#w-tw'); if (cv) drawIntervals(cv, twinRows(4)); });
        return `${pairButtons()}<div class="card"><h3>${trk('DT')} 更新前后的孪生状态 ${ep('INFERRED')}</h3><canvas class="chart" id="w-tw" style="height:200px" role="img" aria-label="Twin state before and after"></canvas></div>${decideBlock()}
          <div class="card"><h3>审计日志</h3>${logBlock()}${S.notice ? `<p class="note">${esc(S.notice)}</p>` : ''}</div>${scenarioBlock()}<div class="card"><h3>${trk('DT')} 下一步证据建议</h3>${nextTable()}</div>`;
      }

  /* ================================================================ validator playground (organizer DS-1 equivalent) */
  const PACKET_SCHEMA = {"$schema": "https://json-schema.org/draft/2020-12/schema", "$id": "evidence_packet_v1.0.schema.json", "title": "MRI/MRS health digital twin — evidence packet v1.0", "description": "Interface object between Quantum Engineering, Precision Mechanics / Metrology, Data Science and Digital Twins (Hackathon Dossier v1.0, §8.2, Appendix E). Educational, non-clinical.", "type": "object", "required": ["packet_version", "packet_id", "subject_id", "session_id", "relative_time", "modality", "source_object", "spatial_reference", "observable", "value", "unit", "uncertainty", "qc_checks", "qc_status", "origin", "value_epistemic", "decision_epistemic", "acquisition_context", "processing", "provenance", "twin_action", "interpretation_limit"], "properties": {"packet_version": {"const": "1.0"}, "packet_id": {"type": "string", "pattern": "^E-t[0-9]+-[a-z0-9_]+$"}, "subject_id": {"type": "string", "pattern": "^sub-[A-Za-z0-9]+$"}, "session_id": {"type": "string", "pattern": "^ses-[A-Za-z0-9]+$"}, "relative_time": {"type": "object", "required": ["value", "unit"], "properties": {"value": {"type": "number"}, "unit": {"enum": ["day", "week", "month", "year", "s"]}}}, "modality": {"enum": ["MRI", "qMRI", "MRS", "MRSI", "HP13C", "calibration"]}, "source_object": {"type": "string", "minLength": 1}, "source_sha256": {"type": ["string", "null"], "pattern": "^[0-9a-f]{64}$"}, "spatial_reference": {"type": "object", "required": ["frame"], "properties": {"frame": {"enum": ["scanner", "registered_anatomical", "named_region"]}}}, "observable": {"type": "string", "minLength": 1}, "value": {"type": ["number", "null"]}, "unit": {"type": "string", "description": "UCUM-style unit; '1' for dimensionless"}, "valid_range": {"type": "array", "items": {"type": "number"}, "minItems": 2, "maxItems": 2}, "uncertainty": {"type": "object", "required": ["type", "value"], "properties": {"type": {"enum": ["SD", "CI95", "CRLB", "category"]}, "value": {"type": ["number", "string", "null"]}, "budget_ref": {"type": "string"}}}, "qc_checks": {"type": "array", "minItems": 1, "items": {"type": "object", "required": ["name", "status", "owner"], "properties": {"name": {"type": "string"}, "value": {"type": ["number", "string", "boolean", "null"]}, "unit": {"type": "string"}, "threshold": {"type": "string"}, "status": {"enum": ["PASS", "WARN", "FAIL"]}, "owner": {"enum": ["QE", "PM", "DS", "DT", "shared"]}}}}, "qc_status": {"enum": ["PASS", "WARN", "FAIL"]}, "qc_reasons": {"type": "array", "items": {"type": "string"}}, "origin": {"enum": ["MEASURED", "SIMULATED"]}, "value_epistemic": {"enum": ["MEASURED", "DERIVED", "INFERRED", "SIMULATED"]}, "decision_epistemic": {"const": "INFERRED"}, "system_qc_id": {"type": ["string", "null"]}, "protocol_match": {"type": ["boolean", "null"]}, "comparable": {"type": ["boolean", "null"]}, "acquisition_context": {"type": "object", "properties": {"field_strength_T": {"type": "number"}, "spectrometer_frequency_MHz": {"type": "number"}, "sequence": {"type": "string"}, "TE_s": {"type": "number"}, "TR_s": {"type": "number"}, "averages": {"type": "integer"}}}, "calibration_id": {"type": ["string", "null"]}, "thresholds_ref": {"type": "string"}, "processing": {"type": "object", "required": ["pipeline", "version"]}, "provenance": {"type": "object", "required": ["parents", "activities"]}, "twin_action": {"type": "object", "required": ["recommended", "reason"], "properties": {"recommended": {"enum": ["update", "update_with_warning", "reject"]}, "reason": {"type": "string"}}}, "interpretation_limit": {"type": "string", "minLength": 1}}, "allOf": [{"if": {"properties": {"qc_status": {"const": "FAIL"}}}, "then": {"properties": {"twin_action": {"properties": {"recommended": {"const": "reject"}}}}}}, {"if": {"properties": {"qc_status": {"const": "WARN"}}}, "then": {"properties": {"twin_action": {"properties": {"recommended": {"enum": ["update_with_warning", "reject"]}}}}}}, {"if": {"properties": {"origin": {"const": "SIMULATED"}}}, "then": {"properties": {"value_epistemic": {"not": {"const": "MEASURED"}}}}}]};
  const RANK = { PASS: 0, WARN: 1, FAIL: 2 };
  const ALLOWED = { PASS: ['update'], WARN: ['update_with_warning', 'reject'], FAIL: ['reject'] };
  function schemaErrors(s, v, p = '$', errs = []) {
    const typeOf = (x) => x === null ? 'null' : Array.isArray(x) ? 'array' : Number.isInteger(x) ? 'integer' : typeof x;
    const okType = (x, t) => [].concat(t).some((y) => y === typeOf(x) || (y === 'number' && typeof x === 'number'));
    if (s.type && !okType(v, s.type)) errs.push(`${p}: expected ${[].concat(s.type).join(' or ')}, got ${typeOf(v)}`);
    if ('const' in s && JSON.stringify(v) !== JSON.stringify(s.const)) errs.push(`${p}: must be ${JSON.stringify(s.const)}`);
    if (s.enum && !s.enum.some((e) => JSON.stringify(e) === JSON.stringify(v))) errs.push(`${p}: ${JSON.stringify(v)} is not one of ${s.enum.join(', ')}`);
    if (s.pattern && typeof v === 'string' && !new RegExp(s.pattern).test(v)) errs.push(`${p}: does not match ${s.pattern}`);
    if (s.minLength && typeof v === 'string' && v.length < s.minLength) errs.push(`${p}: too short`);
    if (Array.isArray(v)) {
      if (s.minItems !== undefined && v.length < s.minItems) errs.push(`${p}: needs at least ${s.minItems} item(s)`);
      if (s.maxItems !== undefined && v.length > s.maxItems) errs.push(`${p}: at most ${s.maxItems} item(s)`);
      if (s.items) v.forEach((x, i) => schemaErrors(s.items, x, `${p}[${i}]`, errs));
    }
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      for (const r of s.required || []) if (!(r in v)) errs.push(`${p}: '${r}' is required`);
      for (const [k, sub] of Object.entries(s.properties || {})) if (k in v) schemaErrors(sub, v[k], `${p}.${k}`, errs);
    }
    for (const sub of s.allOf || []) schemaErrors(sub, v, p, errs);
    if (s.if && !schemaErrors(s.if, v, p, []).length && s.then) schemaErrors(s.then, v, p, errs);
    if (s.not && !schemaErrors(s.not, v, p, []).length) errs.push(`${p}: must not match ${JSON.stringify(s.not)}`);

  }
  function semanticErrors(pk) {
    const errs = [];
    const checks = Array.isArray(pk.qc_checks) ? pk.qc_checks : [];
    if (checks.length) { const w = checks.map((c) => c.status).filter((s) => s in RANK).reduce((a, s) => RANK[s] > RANK[a] ? s : a, 'PASS'); if (pk.qc_status !== w) errs.push(`qc_status ${pk.qc_status} but the worst check is ${w}`); }
    const act = pk.twin_action?.recommended;
    if (pk.qc_status in ALLOWED && !ALLOWED[pk.qc_status].includes(act)) errs.push(`twin_action ${act} is not allowed for ${pk.qc_status}`);
    if (pk.origin === 'SIMULATED' && pk.value_epistemic === 'MEASURED') errs.push('value of SIMULATED origin labelled MEASURED');
    const vr = pk.valid_range; if (typeof pk.value === 'number' && Array.isArray(vr) && !(vr[0] <= pk.value && pk.value <= vr[1])) errs.push(`value outside valid_range`);

  }

    const errs = [];

    if (pk.observable !== method.observable) errs.push(`observable must be ${method.observable}`);
    if (!(pk.uncertainty?.allowance > 0)) errs.push('uncertainty.allowance must be a positive number (method sensitivity allowance)');

    const spec = S.data?.readings.find((r) => packetId(r) === pk.packet_id);
    if (S.data && !spec) errs.push('packet_id does not name a loaded acquisition');
    if (spec && typeof pk.value === 'number' && Math.abs(pk.value - spec.measurement.area) > 1e-6 * Math.abs(spec.measurement.area)) errs.push(`value differs from the replayed area of #${spec.id} (${Ms(spec.measurement.area)} × 10⁶)`);

  }
  const BREAKERS = {
    action: ['FAIL but update', (p) => { p.qc_status = 'FAIL'; p.twin_action.recommended = 'update'; }],

  };
  function seedPacket() { return JSON.stringify(packet(S.study.follow, S.study.gate, S.thresholds), null, 2); }
  function validateText(text) {
    let pk; try { pk = JSON.parse(text); } catch (e) { return `<p>${status('FAIL')} not valid JSON: ${esc(e.message)}</p>`; }
    const a = PACKET_SCHEMA ? schemaErrors(PACKET_SCHEMA, pk) : ['schema not embedded'], b = semanticErrors(pk), c = caseErrors(pk);
    const list = (title, errs, owner) => `<h4>${title} ${trk(owner)}</h4>${errs.length ? `<ul class="small">${errs.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : `<p class="small">${status('PASS')} no errors</p>`}`;
    const ok = !a.length && !b.length;
    return `<p>${ok ? status('PASS') + ' valid evidence packet v1.0' : status('FAIL') + ' invalid'}${ok && c.length ? ` · ${status('WARN')} does not match this case` : ''}</p>${list('Schema v1.0 (StarterPack)', a, 'DS')}${list('Semantic rules (validate_packet.py)', b, 'DS')}${list('Case rules (Birmingham Figure 5)', c, 'PM')}`;
  }
  function playgroundBlock() {

  /* ================================================================ Figures 6 and 7 */
  const EXTRA_MAP = {

  };
  async function loadExtra(files) {
    const groups = {};
    for (const f of files) {
      const p = f.webkitRelativePath || '';
      if (p.includes('__MACOSX')) continue;
      const m = p.match(/(?:^|\/)(Na_[A-Za-z0-9_]+?)\/(acqus|audita\.txt|pdata\/1\/(?:procs|1r))$/);
      if (!m || !EXTRA_MAP[m[1]]) continue;
      (groups[m[1]] ||= {})[m[2].split('/').at(-1)] = f;
    }
    const out = {};
    for (const [name, g] of Object.entries(groups)) {
      if (!g.acqus || !g.procs || !g['1r']) continue;
      const [acqus, procs, audit] = await Promise.all([reader.readText(g.acqus), reader.readText(g.procs), reader.readText(g['audita.txt'])]);
      const aq = reader.parseParameters(acqus), ps = reader.parseParameters(procs);
      const layout = reader.spectrumLayout(g['1r'], ps);
      const sp = await reader.readSpectrum(g['1r'], layout, 0);
      const x = Array.from(sp.real, (_, i) => sp.start + i * sp.step);
      let timing = null; try { timing = parseAudit(audit, aq.get('DATE')); } catch { const m = audit.match(/started at (\d{4}-\d\d-\d\d \d\d:\d\d:\d\d\.\d{3}) ([+-]\d\d)(\d\d)/); const st = m ? Date.parse(m[1].replace(' ', 'T') + m[2] + ':' + m[3]) : NaN; const en = Number(aq.get('DATE')) * 1000; timing = Number.isFinite(st) ? { start: st, end: en > st ? en : null, unverified: true } : null; }
      const params = Object.fromEntries(['NS', 'TD', 'SW_h', 'PULPROG'].map((k) => [k, aq.get(k) ?? null]).concat(['SI', 'LB', 'PHC0', 'PHC1', 'ABSG', 'NC_proc', 'OFFSET'].map((k) => [k, ps.get(k) ?? null])));
      out[EXTRA_MAP[name].key] = { name, ...EXTRA_MAP[name], x, real: Array.from(sp.real), NS: Number(aq.get('NS')), params, timing, path: g['1r'].webkitRelativePath };
    }

  }
  const trap = (x, y, [lo, hi]) => { let s = 0; for (let i = 1; i < x.length; i++) if (x[i] >= lo && x[i] <= hi && x[i - 1] >= lo && x[i - 1] <= hi) s += (y[i] + y[i - 1]) * Math.abs(x[i] - x[i - 1]) / 2; return s; };
  const peakIn = (x, y, [lo, hi]) => { let k = -1; for (let i = 0; i < x.length; i++) if (x[i] >= lo && x[i] <= hi && (k < 0 || y[i] > y[k])) k = i; return k < 0 ? null : { ppm: x[k], val: y[k] }; };

  /* ================================================================ time-series chart (small multiples) */
  function drawTrend(cv, panels, cur) {
    const g = setup(cv); if (!g) return;
    const { ctx, c, w, h: H } = g;
    const rs = S.data.readings, tEnd = rs.at(-1).window[1];
    const f = { l: 190, r: w - 16, t: 6, b: H - 30 };
    const X = lin(0, tEnd, f.l, f.r);
    const ph = (f.b - f.t) / panels.length;
    panels.forEach((p, k) => {
      const top = f.t + k * ph + 8, bot = f.t + (k + 1) * ph - 8;
      const pts = p.points.filter((q) => q.v !== null && Number.isFinite(q.v));
      let mn = Math.min(...pts.map((q) => q.lo ?? q.v)), mx = Math.max(...pts.map((q) => q.hi ?? q.v));
      if (p.zero) { mn = Math.min(mn, 0); mx = Math.max(mx, 0); }
      const pad = (mx - mn || 1) * .1; const Y = lin(mn - pad, mx + pad, bot, top);
      ctx.fillStyle = c('surface-2'); ctx.fillRect(f.l, top, f.r - f.l, bot - top);
      ctx.strokeStyle = c('line'); ctx.strokeRect(f.l, top, f.r - f.l, bot - top);
      if (p.zero) { ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(f.l, Y(0)); ctx.lineTo(f.r, Y(0)); ctx.stroke(); ctx.setLineDash([]); }
      ctx.fillStyle = c('ink'); ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.font = '650 11.5px ' + c('font-ui');
      ctx.fillText(p.label, f.l - 8, top); ctx.font = '10.5px ' + c('font-ui'); ctx.fillStyle = c('muted');
      ctx.fillText(p.sub || '', f.l - 8, top + 15); ctx.textBaseline = 'middle';
      ctx.fillText(p.fmt(mx + pad), f.l - 8, top + 34 < bot - 8 ? bot - 2 - 12 : bot - 6);
      ctx.strokeStyle = c(p.color); ctx.lineWidth = 1.4; ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(X(q.t), Y(q.v)) : ctx.moveTo(X(q.t), Y(q.v))); ctx.stroke();
      for (const q of pts) {
        if (q.lo !== undefined) { ctx.beginPath(); ctx.moveTo(X(q.t), Y(q.lo)); ctx.lineTo(X(q.t), Y(q.hi)); ctx.stroke(); }
        ctx.fillStyle = q.filled === false ? c('surface') : c(p.color); ctx.beginPath(); ctx.arc(X(q.t), Y(q.v), 3.5, 0, 7); ctx.fill(); ctx.stroke();

    ctx.fillStyle = c('ink-2'); ctx.textBaseline = 'bottom'; ctx.fillText('acquisition midpoint (h from first NMR start)', (f.l + f.r) / 2, H - 1);
    const cx = X(rs[cur].mid); ctx.strokeStyle = c('orange'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, f.t); ctx.lineTo(cx, f.b); ctx.stroke(); ctx.lineWidth = 1;

  }

  /* ================================================================ looping animation (Visualize, left) */
  const ANIM = { on: !matchMedia('(prefers-reduced-motion: reduce)').matches, step: 0, phase: 0, last: 0, speed: 1, raf: 0, cache: null };
  function animCache() {
    if (ANIM.cache?.data === S.data) return ANIM.cache;
    const rs = S.data.readings;
    const ext = ([lo, hi]) => { let mn = 0, mx = 0; for (const r of rs) for (let i = 0; i < r.x.length; i++) if (r.x[i] >= lo && r.x[i] <= hi) { mn = Math.min(mn, r.real[i]); mx = Math.max(mx, r.real[i]); } return [mn, mx]; };
    const el = S.data.electrochemistry.rows, step = Math.max(1, Math.floor(el.length / 600));
    const volt = []; for (let i = 0; i < el.length; i += step) volt.push([el[i][0], el[i][2]]);
    ANIM.cache = { data: S.data, full: ext([-250, 1450]), zoom: ext([100, 1260]), volt, vmin: Math.min(...volt.map((v) => v[1])), vmax: Math.max(...volt.map((v) => v[1])) };
    return ANIM.cache;
  }
  function drawAnim(cv) {
    const g = setup(cv); if (!g) return;
    const { ctx, c, w, h: H } = g;
    const rs = S.data.readings, n = rs.length, i = Math.min(ANIM.step, n - 1), cur = rs[i];
    const fade = ANIM.on ? Math.min(1, ANIM.phase * 3) : 1;
    const C = animCache();
    const panels = [
      { range: [-250, 1450], y: C.full, t: 34, b: H * 0.40, title: '全谱（电解液峰在 0 ppm 附近）' },
      { range: [100, 1260], y: C.zoom, t: H * 0.40 + 26, b: H * 0.74, title: '放大 100–1260 ppm：准金属区与金属区', regions: true }
    ];
    ctx.font = '600 13px ' + c('font-ui'); ctx.fillStyle = c('ink'); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    const v = midpointVoltage(S.data.electrochemistry, cur.mid - S.offset);
    ctx.fillText(`#${cur.id}  ·  ${h(cur.mid)} h  ·  ${v === null ? '—' : v.toFixed(2) + ' V'}  ·  step ${i + 1} / ${n}`, 8, 8);
    ctx.textAlign = 'right'; ctx.font = '11px ' + c('font-ui'); ctx.fillStyle = ANIM.on ? c('teal-text') : c('orange-text');
    ctx.fillText(ANIM.on ? '▶ 播放中' : '❚❚ 已暂停', w - 10, 10);
    for (const p of panels) {
      const f = { l: 46, r: w - 12, t: p.t, b: p.b };
      const X = lin(p.range[1], p.range[0], f.l, f.r);
      const pad = (p.y[1] - p.y[0]) * .06, Y = lin(p.y[0] - pad, p.y[1] + pad, f.b, f.t);
      if (p.regions) regionBands(g, f, X, { alpha: .9 });
      ctx.strokeStyle = c('line-strong'); ctx.lineWidth = 1; ctx.strokeRect(f.l, f.t, f.r - f.l, f.b - f.t);
      ctx.fillStyle = c('muted'); ctx.font = '10.5px ' + c('font-ui'); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (const t of ticks(p.range[0], p.range[1], 6)) ctx.fillText(String(t), X(t), f.b + 3);
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillStyle = c('ink-2'); ctx.fillText(p.title + ' · ppm', f.l, f.t - 3);
      ctx.save(); ctx.beginPath(); ctx.rect(f.l, f.t, f.r - f.l, f.b - f.t); ctx.clip();
      ctx.strokeStyle = c('line-strong'); ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(f.l, Y(0)); ctx.lineTo(f.r, Y(0)); ctx.stroke(); ctx.setLineDash([]);
      for (let k = 4; k >= 1; k--) {
        const j = i - k; if (j < 0) continue;
        ctx.globalAlpha = 0.1 + 0.1 * (4 - k); ctx.strokeStyle = c('violet-deep'); ctx.lineWidth = 1.2;
        trace(ctx, rs[j].x, rs[j].real, X, Y, p.range[0], p.range[1]);
      }
      if (fade < 1 && i > 0) { ctx.globalAlpha = 1 - fade; ctx.strokeStyle = c('ink'); ctx.lineWidth = 2; trace(ctx, rs[i - 1].x, rs[i - 1].real, X, Y, p.range[0], p.range[1]); }
      ctx.globalAlpha = fade; ctx.strokeStyle = c('ink'); ctx.lineWidth = 2.2; trace(ctx, cur.x, cur.real, X, Y, p.range[0], p.range[1]);
      ctx.globalAlpha = 1; ctx.lineWidth = 1; ctx.restore();
    }
    // voltage strip with all NMR windows
    const tEnd = Math.max(rs.at(-1).window[1], S.data.electrochemistry.last + S.offset);
    const f = { l: 46, r: w - 12, t: H * 0.74 + 34, b: H - 20 };
    const X = lin(0, tEnd, f.l, f.r), Y = lin(C.vmin - .1, C.vmax + .1, f.b, f.t);
    ctx.fillStyle = c('ink-2'); ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.font = '10.5px ' + c('font-ui');
    ctx.fillText('电池电压与 NMR 时间窗 · 自第一次 NMR 开始的时间（h）', f.l, f.t - 3);
    for (const r of rs) { ctx.fillStyle = r === cur ? c('orange-soft') : c('wash'); ctx.fillRect(X(r.window[0]), f.t, X(r.window[1]) - X(r.window[0]), f.b - f.t); }
    ctx.strokeStyle = c('line-strong'); ctx.strokeRect(f.l, f.t, f.r - f.l, f.b - f.t);
    ctx.strokeStyle = c('blue-text'); ctx.lineWidth = 1.5; ctx.beginPath(); C.volt.forEach(([t, vv], k) => { const x = X(t + S.offset), y = Y(vv); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); ctx.lineWidth = 1;
    if (v !== null) { ctx.fillStyle = c('orange-text'); ctx.beginPath(); ctx.arc(X(cur.mid), Y(v), 5, 0, 7); ctx.fill(); }
    ctx.fillStyle = c('muted'); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (const t of ticks(0, tEnd / 3600, 8)) ctx.fillText(String(t), X(t * 3600), f.b + 3);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(C.vmax.toFixed(1) + ' V', f.l - 4, Y(C.vmax)); ctx.fillText(C.vmin.toFixed(1) + ' V', f.l - 4, Y(C.vmin));
    cv.onclick = toggleAnim;
  }
  function animFrame(now) {
    const cv = document.getElementById('vz-anim');
    if (!cv || !S.data || !ANIM.on) { ANIM.raf = 0; ANIM.last = 0; return; }
    const n = S.data.readings.length;
    if (ANIM.last) {
      const dur = (ANIM.step === n - 1 ? 2200 : 1100) / ANIM.speed;
      ANIM.phase += (now - ANIM.last) / dur;
      if (ANIM.phase >= 1) { ANIM.phase = 0; ANIM.step = (ANIM.step + 1) % n; }
    }
    ANIM.last = now;
    drawAnim(cv);
    ANIM.raf = requestAnimationFrame(animFrame);
  }
  function startAnim() { if (!ANIM.raf) ANIM.raf = requestAnimationFrame(animFrame); }
  function toggleAnim() {
    ANIM.on = !ANIM.on; ANIM.last = 0;
    if (ANIM.on) startAnim(); else { ANIM.phase = 0; const cv = document.getElementById('vz-anim'); if (cv) drawAnim(cv); }
    const b = document.querySelector('[data-act="anim"]'); if (b) b.textContent = ANIM.on ? '❚❚ 暂停' : '▶ 播放';
  }

      const hasFig5 = list.some((f) => /(^|\/)Na_fullSpectrum_\d+\/fid$/.test(f.webkitRelativePath || ''));
      const extra = await loadExtra(list);

      if (hasFig5) {
        S.data = await load(list);

      }
      Object.assign(S.extra, extra);

  function init() {
    try { const t = localStorage.getItem('mdx-team-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
    $('#glossBody').innerHTML = `<dl>${GLOSSARY.map(([t, d]) => `<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl>`;
    bind();
    if (!location.hash) history.replaceState(null, '', '#home');
    render();
  }
  window.BatteryTwinExplorer = { loadFiles, state: S, evaluate, packet, buildBundle, validateText };
  init();

})();
