<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Battery Twin Explorer: a guided tour and a workbench that follow operando 23Na NMR spectra of one sodium-ion full cell (Bray et al. 2020, Figure 5) from the raw Bruker files to a quality-gated digital-twin update.">
<title>电池孪生 Explorer（中文）</title>
<style>
/* Battery Twin Explorer — layout and visual system follow the organizer's MRI Data Explorer v1.0-rc5
 * (header + start page + 9-stop guided tour + three-column workbench; navy ink, lavender/cyan washes, four track colours). */
:root {
  --bg: #FEFEFD; --surface: #FFFFFF; --surface-2: #F7F8FE; --wash: #F1F2FC; --wash-2: #EEF8FB;
  --ink: #1D2B53; --ink-2: #3C4C82; --muted: #66709A; --line: #DADCF4; --line-strong: #BAC5EE;
  --violet: #8C8CDC; --violet-deep: #5858B8; --violet-soft: #E6E6F8; --violet-pale: #C9C9EE;
  --blue: #2F8FE0; --blue-text: #1D6FC0; --blue-soft: #E3EEFB; --blue-dash: #4BA3E8;
  --orange: #F28C38; --orange-text: #A85A0C; --orange-soft: #FDEBDD; --orange-band: #FBD9BF;
  --teal: #1F9E86; --teal-text: #137A67; --teal-soft: #DDF5EF;
  --purple: #8A5CC8; --purple-text: #7A4FBF; --purple-soft: #EFE6F7;
  --pass: #2E7D32; --pass-bg: #E3F4E4; --warn: #8A6100; --warn-bg: #FFF3CC; --fail: #B4232F; --fail-bg: #FBE3E5; --info: #3C4C82; --info-bg: #E9ECFA;
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  --r-lg: 14px; --r-md: 10px; --r-sm: 6px;
  --shadow-focus: 0 0 0 3px rgba(47, 143, 224, .35);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1330; --surface: #141B3D; --surface-2: #18204A; --wash: #1B2350; --wash-2: #172848;
    --ink: #E8EBFB; --ink-2: #BCC3EA; --muted: #9AA3D1; --line: #2A3462; --line-strong: #3B4782;
    --violet: #A5A5F0; --violet-deep: #B4B4F5; --violet-soft: #262F63; --violet-pale: #3A437F;
    --blue: #5AAAF2; --blue-text: #8CC3F7; --blue-soft: #1D2D5C; --blue-dash: #6CB6F0;
    --orange: #F7A35C; --orange-text: #F5B57A; --orange-soft: #3A2A2A; --orange-band: #5A3B2A;
    --teal: #3CC2A6; --teal-text: #4CC7AE; --teal-soft: #173B3A;
    --purple: #B494EE; --purple-text: #C2A6F2; --purple-soft: #2E2652;
    --pass: #7BD486; --pass-bg: #18392A; --warn: #F0C350; --warn-bg: #3A3216; --fail: #FF8A94; --fail-bg: #45202A; --info: #BCC3EA; --info-bg: #222B5A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1330; --surface: #141B3D; --surface-2: #18204A; --wash: #1B2350; --wash-2: #172848;
  --ink: #E8EBFB; --ink-2: #BCC3EA; --muted: #9AA3D1; --line: #2A3462; --line-strong: #3B4782;
  --violet: #A5A5F0; --violet-deep: #B4B4F5; --violet-soft: #262F63; --violet-pale: #3A437F;
  --blue: #5AAAF2; --blue-text: #8CC3F7; --blue-soft: #1D2D5C; --blue-dash: #6CB6F0;
  --orange: #F7A35C; --orange-text: #F5B57A; --orange-soft: #3A2A2A; --orange-band: #5A3B2A;
  --teal: #3CC2A6; --teal-text: #4CC7AE; --teal-soft: #173B3A;
  --purple: #B494EE; --purple-text: #C2A6F2; --purple-soft: #2E2652;
  --pass: #7BD486; --pass-bg: #18392A; --warn: #F0C350; --warn-bg: #3A3216; --fail: #FF8A94; --fail-bg: #45202A; --info: #BCC3EA; --info-bg: #222B5A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--shadow-focus); border-radius: var(--r-sm); }
.mono { font-family: var(--font-mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
a { color: var(--blue-text); }
[hidden] { display: none !important; }
code { font-family: var(--font-mono); font-size: 11.5px; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* shell and header */
.shell { min-height: 100%; display: flex; flex-direction: column; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); gap: 10px; max-width: 1680px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; color: var(--ink); }
.brand svg { width: 44px; height: 44px; flex: none; }
.brand-text { display: flex; flex-direction: column; }
.brand-name { font-family: var(--font-display); font-size: 21px; font-weight: 760; letter-spacing: -.01em; line-height: 1.1; }
.brand-sub { font-size: 12px; color: var(--muted); }
.modes { display: flex; gap: 2px; margin-left: 14px; }
.modes a { color: var(--ink-2); text-decoration: none; font-weight: 650; font-size: 14px; padding: 8px 12px; border-radius: var(--r-md); position: relative; }
.modes a:hover { background: var(--wash); color: var(--ink); }
.modes a[aria-current="page"] { color: var(--ink); }
.modes a[aria-current="page"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 3px; background: var(--ink); }
.top-spacer { flex: 1; }
.ver { font: 600 11px var(--font-mono); color: var(--violet-deep); background: var(--violet-soft); border-radius: 999px; padding: 2px 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 13px; font-weight: 650; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--violet-soft); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.primary:hover { background: var(--ink-2); }
.btn.ghost { border-color: var(--line-strong); font-weight: 600; }
.btn.small { padding: 2px 10px; font-size: 12px; border-width: 1.5px; }
.btn.big { padding: 9px 20px; font-size: 14.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; border: 1.5px solid var(--line-strong); color: var(--ink-2); background: var(--surface); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.ok .dot { background: var(--teal); }
.pill.err { border-color: var(--fail); color: var(--fail); }
.gloss-ic { font: 750 10.5px var(--font-mono); background: var(--violet-soft); color: var(--violet-deep); border-radius: 5px; padding: 1px 4px; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; border: 1.5px solid transparent; }
.chip.PASS { color: var(--pass); background: var(--pass-bg); }
.chip.WARN { color: var(--warn); background: var(--warn-bg); }
.chip.FAIL { color: var(--fail); background: var(--fail-bg); }
.chip.INFO { color: var(--info); background: var(--info-bg); }
.chip.ep { background: transparent; color: var(--ink-2); border-color: var(--line-strong); font-weight: 650; font-size: 10px; letter-spacing: .06em; padding: 0 6px; }
.chip.ep.MEASURED { border-color: var(--ink); color: var(--ink); }
.chip.ep.DERIVED { border-color: var(--violet); color: var(--violet-deep); }
.chip.ep.INFERRED { border-color: var(--blue); color: var(--blue-text); }
.chip.ep.SCENARIO { border-style: dashed; border-color: var(--orange); color: var(--orange-text); }
.chip.ep.REPORTED { border-style: dotted; border-color: var(--teal); color: var(--teal-text); }
.chip.trk { color: #fff; font-size: 10px; padding: 0 6px; }
.chip.trk.QE { background: var(--blue-text); } .chip.trk.PM { background: var(--teal-text); } .chip.trk.DS { background: var(--purple-text); } .chip.trk.DT { background: var(--orange-text); }
:root[data-theme="dark"] .chip.trk { color: #0D1330; }

/* cards, tables */
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px; min-width: 0; }
.card.wash { background: var(--wash); border-color: transparent; }
.card.cyan { background: var(--wash-2); border-color: transparent; }
.card h3 { font-family: var(--font-display); font-size: 14.5px; font-weight: 720; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card h4 { font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin: 12px 0 4px; }
.card p { margin: 6px 0; color: var(--ink-2); font-size: 12.5px; max-width: 80ch; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.small { font-size: 11.5px; color: var(--muted); }
.big { font-family: var(--font-display); font-size: 22px; font-weight: 760; font-variant-numeric: tabular-nums; }
.note { background: var(--wash-2); border-radius: var(--r-md); padding: 10px 12px; font-size: 12px; color: var(--ink-2); margin: 0; }
.note.err { background: var(--fail-bg); color: var(--fail); }
.tbl-wrap { overflow-x: auto; }
.tbl { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.tbl th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 650; padding: 6px 8px; border-bottom: 1.5px solid var(--line-strong); white-space: nowrap; }
.tbl td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.sel td { background: var(--blue-soft); }
.tbl tr.clickable { cursor: pointer; }
.tbl tr.clickable:hover td { background: var(--wash); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; font-size: 12.5px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
select, input[type="number"] { border: 1.5px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); padding: 3px 6px; font-size: 12.5px; }
label.ctl { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
input[type="range"] { accent-color: var(--violet-deep); }
canvas.chart { width: 100%; display: block; background: var(--surface); border-radius: 12px; }
.readout { font: 12px var(--font-mono); color: var(--ink-2); min-height: 1.4em; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.seg { display: inline-flex; border: 1.5px solid var(--line-strong); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 3px 11px; font-size: 12px; font-weight: 650; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* start page */
.home { display: flex; flex-direction: column; gap: 40px; padding: 18px 0 28px; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 36px; align-items: center; }
.hero h1 { font-family: var(--font-display); font-size: clamp(28px, 3.1vw, 42px); line-height: 1.12; font-weight: 770; letter-spacing: -.015em; max-width: 21ch; }
.hero-kicker { margin: 0 0 12px; font-size: 13.5px; font-weight: 700; color: var(--violet-deep); }
.hero-lead { font-size: 17px; line-height: 1.55; color: var(--ink-2); max-width: 58ch; margin: 18px 0 0; }
.hero-example { font-size: 14.5px; line-height: 1.5; color: var(--ink-2); max-width: 58ch; margin: 12px 0 0; padding: 8px 12px; border-left: 4px solid var(--violet-deep); background: var(--wash); border-radius: 0 10px 10px 0; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
.hero-note { font-size: 13px; color: var(--muted); margin: 12px 0 0; max-width: 58ch; }
.hero-art { margin: 0; border: 2px solid var(--ink); border-radius: 20px; overflow: hidden; background: var(--surface); }
.hero-art svg { width: 100%; height: auto; display: block; }
.hero-art figcaption { font-size: 12.5px; color: var(--ink-2); border-top: 1.5px solid var(--line); padding: 7px 12px 8px; line-height: 1.4; }
.home h2 { font-family: var(--font-display); font-size: 24px; font-weight: 750; }
.home section > p { max-width: 80ch; color: var(--ink-2); margin: 8px 0 0; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.tile { border-top: 4px solid var(--ink); padding-top: 10px; }
.tile.QE { border-color: var(--blue); } .tile.PM { border-color: var(--teal); } .tile.DS { border-color: var(--purple); } .tile.DT { border-color: var(--orange); }
.tile h3 { font-family: var(--font-display); font-size: 16.5px; }
.tile .who { font-size: 12px; color: var(--muted); font-weight: 650; margin: 2px 0 6px; }
.tile p { font-size: 13.5px; color: var(--ink-2); margin: 0; line-height: 1.5; }
.path { list-style: none; padding: 0; margin: 14px 0 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.path a { display: flex; gap: 10px; align-items: center; text-decoration: none; color: var(--ink); padding: 8px; border-radius: var(--r-md); }
.path a:hover { background: var(--wash); }
.path b { display: block; font-size: 14px; } .path small { color: var(--muted); font-size: 12px; }
.path-n { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid var(--blue); background: var(--surface); display: grid; place-items: center; font: 750 15px var(--font-display); color: var(--ink); flex: none; }
.PM .path-n, .path-n.PM { border-color: var(--teal); } .DS .path-n, .path-n.DS { border-color: var(--purple); } .DT .path-n, .path-n.DT { border-color: var(--orange); }

/* guided tour */
.tour { display: flex; flex-direction: column; gap: 16px; padding: 12px 0 18px; }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); }
.rail li { position: relative; min-width: 0; }
.rail li + li::before { content: ""; position: absolute; left: -50%; right: 50%; top: 16px; border-top: 2px dashed var(--line-strong); margin: 0 20px; }
.rail-stop { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 600; padding: 2px; border-radius: var(--r-md); position: relative; z-index: 1; text-align: center; }
.rail-stop .path-n { width: 32px; height: 32px; font-size: 13px; border-width: 2px; }
.rail-stop:hover, .rail-stop[aria-current="step"] { color: var(--ink); }
.rail-stop[aria-current="step"] .path-n { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.example-band { margin: 0; padding: 6px 12px; font-size: 13px; color: var(--ink-2); background: var(--wash); border-radius: 10px; }
.stop { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.stop-visual { background: var(--wash); border-radius: 18px; padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.stop-text { min-width: 0; max-width: 64ch; }
.stop-meta { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin: 0 0 8px; flex-wrap: wrap; }
.stop-text h2 { font-family: var(--font-display); font-size: clamp(22px, 2.2vw, 30px); line-height: 1.18; font-weight: 760; letter-spacing: -.01em; }
.stop-lead { font-size: 17.5px; line-height: 1.45; color: var(--ink); font-weight: 560; margin: 14px 0 12px; }
.stop-text > p { font-size: 15px; line-height: 1.6; color: var(--ink-2); margin: 10px 0; }
.try { background: var(--wash-2); border-left: 4px solid var(--blue); border-radius: 0 var(--r-md) var(--r-md) 0; padding: 10px 14px; font-size: 14.5px; color: var(--ink-2); margin: 14px 0; }
.stop.PM .try { border-color: var(--teal); } .stop.DS .try { border-color: var(--purple); } .stop.DT .try { border-color: var(--orange); }
.deeper { margin-top: 16px; border-top: 1.5px solid var(--line); padding-top: 10px; }
.deeper summary { cursor: pointer; font-weight: 700; font-size: 14.5px; padding: 4px 0; }
.deeper p, .deeper li { font-size: 14px; line-height: 1.6; color: var(--ink-2); }
.stop-nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1.5px solid var(--line); padding-top: 14px; }
.missing { padding: 28px 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.missing p { color: var(--ink-2); max-width: 52ch; margin: 0; }
.steps { display: flex; gap: 8px; flex-wrap: wrap; }
.steps button { display: inline-flex; gap: 8px; align-items: center; border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: var(--r-md); padding: 5px 10px 5px 6px; cursor: pointer; font-weight: 650; font-size: 12.5px; }
.steps .path-n { width: 24px; height: 24px; font-size: 11.5px; border-width: 2px; border-color: var(--orange); }
.steps button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.steps button[aria-pressed="true"] .path-n { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* passport / packet */
.passport { background: var(--surface); border: 2px solid var(--ink); border-radius: 14px; padding: 12px 16px; }
.passport header { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.passport h3 { font-family: var(--font-display); font-size: 17px; }
.big-num { font-family: var(--font-display); font-size: 26px; font-weight: 760; font-variant-numeric: tabular-nums; margin: 8px 0 2px; }
.checks { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 6px; }
.checks li { display: grid; grid-template-columns: 62px minmax(0, 1fr) 34px; gap: 8px; align-items: start; font-size: 12.5px; }
.checks li b { display: block; }
.checks li span.small { display: block; }
.packet-list { display: flex; flex-wrap: wrap; gap: 6px; }
.packet-list button { display: inline-flex; gap: 6px; align-items: center; border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 4px; cursor: pointer; font-size: 12.5px; font-weight: 650; }
.packet-list button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.answer { background: var(--surface); border: 2px solid var(--ink); border-radius: 14px; padding: 12px 16px; }
.answer h4 { font-family: var(--font-display); font-size: 16px; margin: 0 0 6px; }
.answer ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; color: var(--ink-2); }
.chain { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; counter-reset: c; }
.chain li { background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: var(--r-md); padding: 7px 9px; font-size: 12.5px; font-weight: 650; display: flex; gap: 8px; align-items: center; }
.chain .path-n { width: 24px; height: 24px; font-size: 11.5px; border-width: 2px; }
.decide { display: flex; flex-direction: column; gap: 8px; border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px; background: var(--surface); }
.decide label { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: flex-start; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.log li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.prov { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; }

<script>
/* Bruker TopSpin data reader and local catalog. */
(function (root) {
  'use strict';

  const collator = new Intl.Collator('en', { numeric: true });
  const values = (map) => [...map.values()].sort((a, b) => collator.compare(a.name, b.name));
  const enclosing = (path) => path.slice(0, path.lastIndexOf('/'));
  const last = (path) => path.split('/').at(-1);
  const rawNames = new Set(['fid', 'ser', 'acqus', 'acqu2s', 'vdlist', 'audita.txt']);
  const processedNames = new Set(['1r', '1i', '2rr', 'procs', 'proc2s', 'title']);

  function catalog(files) {
    const samples = new Map();
    for (const file of files) {
      const path = file.webkitRelativePath || '';
      const name = file.name;
      let experimentPath;
      let processingName;
      if (processedNames.has(name)) {
        const match = enclosing(path).match(/^(.+)\/pdata\/(\d+)$/);
        if (!match) continue;
        [, experimentPath, processingName] = match;
      } else if (rawNames.has(name)) {
        experimentPath = enclosing(path);
      } else {
        continue;
      }
      const experimentName = last(experimentPath);
      const samplePath = enclosing(experimentPath);
      if (!/^(?:\d+|Na_fullSpectrum_\d+)$/.test(experimentName) || !samplePath || samplePath.split('/').some((part) => part.startsWith('.') || part === '__MACOSX')) continue;
      if (!samples.has(samplePath)) samples.set(samplePath, { name: last(samplePath), path: samplePath, experiments: new Map() });
      const sample = samples.get(samplePath);
      if (!sample.experiments.has(experimentName)) {
        sample.experiments.set(experimentName, { name: experimentName, path: experimentPath, files: new Map(), processed: new Map() });
      }
      const experiment = sample.experiments.get(experimentName);
      if (processingName) {
        if (!experiment.processed.has(processingName)) experiment.processed.set(processingName, { name: processingName, files: new Map() });
        experiment.processed.get(processingName).files.set(name, file);
      } else {
        experiment.files.set(name, file);
      }
    }
    for (const [samplePath, sample] of samples) {
      for (const [name, exp] of sample.experiments) {
        for (const [number, proc] of exp.processed) {
          if (!proc.files.has('procs')) exp.processed.delete(number);
        }
        if (!exp.files.has('fid') && !exp.files.has('ser') && !exp.processed.size) sample.experiments.delete(name);
      }
      if (!sample.experiments.size) samples.delete(samplePath);
    }
    return values(samples);
  }

  function parseParameters(text) {
    const parameters = new Map();
    for (const match of text.matchAll(/^##\$(\w+)=[ \t]*([^\r\n]*)/gm)) {
      const [, key, value] = match;
      parameters.set(key, value.trim().replace(/^<(.*)>$/, '$1'));
    }
    return parameters;
  }

  const readText = async (file) => file ? new TextDecoder('windows-1252').decode(await file.arrayBuffer()) : '';

  function number(parameters, key, positive = false) {
    const raw = parameters.get(key);
    const value = Number(raw);
    if (!raw || !Number.isFinite(value) || (positive && value <= 0)) throw new Error(`Missing or invalid parameter ${key}.`);
    return value;
  }

  function binaryFormat(parameters, typeKey, orderKey) {
    const type = number(parameters, typeKey);
    const order = number(parameters, orderKey);
    if (![0, 2].includes(type) || ![0, 1].includes(order)) throw new Error(`Unsupported ${typeKey} or ${orderKey}.`);
    return { bytes: type === 0 ? 4 : 8, floating: type === 2, littleEndian: order === 0 };
  }

  function valueAt(view, index, format) {
    const offset = index * format.bytes;
    return format.floating ? view.getFloat64(offset, format.littleEndian) : view.getInt32(offset, format.littleEndian);
  }

  function rawLayout(file, acquisition, indirect = new Map()) {
    const format = binaryFormat(acquisition, 'DTYPA', 'BYTORDA');
    const acquisitionMode = number(acquisition, 'AQ_mod');
    if (![1, 3].includes(acquisitionMode)) throw new Error(`Acquisition mode ${acquisitionMode} cannot be displayed as a complex FID.`);
    const words = number(acquisition, 'TD', true);
    if (!Number.isInteger(words) || words % 2) throw new Error('TD must contain an even number of real and imaginary values.');
    const bytes = words * format.bytes;
    const stride = file.name === 'ser' ? Math.ceil(bytes / 1024) * 1024 : bytes;
    if (file.size < stride || (file.name === 'ser' && file.size % stride !== 0)) throw new Error('The file size does not match the FID or SER trace layout.');
    const traces = file.name === 'ser' ? file.size / stride : 1;
    const indirectTD = Number(indirect.get('TD'));
    return { format, words, bytes, stride, traces, indirectTD, step: 1000 / number(acquisition, 'SW_h', true) };
  }

  async function readTrace(file, layout, row) {
    if (!Number.isInteger(row) || row < 0 || row >= layout.traces) throw new Error('Select a valid trace number.');
    const offset = row * layout.stride;
    const view = new DataView(await file.slice(offset, offset + layout.bytes).arrayBuffer());
    const real = new Float64Array(layout.words / 2);
    const imaginary = new Float64Array(real.length);
    for (let i = 0; i < real.length; i++) {
      real[i] = valueAt(view, i * 2, layout.format);
      imaginary[i] = valueAt(view, i * 2 + 1, layout.format);
    }
    return { start: 0, step: layout.step, real, imaginary };
  }

  function spectrumLayout(file, processing, indirect = new Map()) {
    const format = binaryFormat(processing, 'DTYPP', 'BYTORDP');
    const columns = number(processing, 'SI', true);
    const rows = file.name === '2rr' ? number(indirect, 'SI', true) : 1;
    const tileColumns = rows > 1 ? number(processing, 'XDIM', true) : columns;
    const tileRows = rows > 1 ? number(indirect, 'XDIM', true) : 1;
    if (![columns, rows, tileColumns, tileRows].every(Number.isInteger) || columns % tileColumns || rows % tileRows || file.size !== rows * columns * format.bytes) {
      throw new Error('The file size does not match the processed Bruker spectrum layout.');
    }
    const offset = number(processing, 'OFFSET');
    const step = -number(processing, 'SW_p', true) / number(processing, 'SF', true) / columns;
    const scale = 2 ** number(processing, 'NC_proc');
    if (!Number.isFinite(scale) || scale === 0) throw new Error('Invalid processed intensity scale.');
    return { format, rows, columns, tileRows, tileColumns, offset, step, scale };
  }

  async function readSpectrum(file, layout, row) {
    if (!Number.isInteger(row) || row < 0 || row >= layout.rows) throw new Error('Select a valid spectrum row.');
    const { columns, tileRows, tileColumns, format } = layout;
    const real = new Float64Array(columns);
    const tilesAcross = columns / tileColumns;
    const firstTile = Math.floor(row / tileRows) * tilesAcross;
    const rowInTile = (row % tileRows) * tileColumns;
    for (let tile = 0; tile < tilesAcross; tile++) {
      const firstWord = (firstTile + tile) * tileRows * tileColumns + rowInTile;
      const view = new DataView(await file.slice(firstWord * format.bytes, (firstWord + tileColumns) * format.bytes).arrayBuffer());
      for (let j = 0; j < tileColumns; j++) real[tile * tileColumns + j] = valueAt(view, j, format) * layout.scale;
    }
    return { start: layout.offset, step: layout.step, real };
  }

  root.BirminghamReader = { catalog, values, readText, parseParameters, number, rawLayout, readTrace, spectrumLayout, readSpectrum };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Battery Twin Explorer: analysis core (copied unchanged from the team Birmingham Explorer, plus kept imaginary data) and organizer-style UI. */
(function () {
  'use strict';
  const reader = window.BirminghamReader;
  const figure = 'Figure_5';
  const caseId = 'birmingham-sodium-ion-full-cell-figure-5';
  const storageKey = 'mdx:' + caseId + ':accepted-update:v1';
  const chemistryFile = 'Electrochemistry_30mAhg-1.txt_1';
  const dataset = 'https://edata.bham.ac.uk/456/';
  const publication = 'https://doi.org/10.1038/s41467-020-15938-x';
  const unit = 'a.u.·ppm';
  const method = {
    version: '1.0',
    observable: 'relative_metallic_sodium_region_signed_integral',
    processing_number: 2,
    intensity_scale: 'stored value × 2^NC_proc',
    ppm_axis: 'OFFSET − index × SW_p / (SF × SI)',
    signal_window_ppm: [1020, 1150],
    sidebands_ppm: [[940, 980], [1190, 1230]],
    baseline: 'One least-squares line across both sidebands, fitted separately to 1r and 1i.',
    quadrature: 'Trapezoids between grid points within the window, using positive ppm widths.',
    peak_to_residual_sd_minimum: 5,
    sideband_shift_ppm: 10,
    phase_stress_deg: 10,
    uncertainty: 'Sum of real sideband residual SD × 130 ppm, max area shift over four independent ±10 ppm sideband combinations, and max area shift under ±10° constant rotation (real × cos θ − imaginary × sin θ).',
    uncertainty_kind: 'Method sensitivity allowance, not a probability interval or detection limit.',
    limits: 'Within this cell only. No absolute sodium mass, morphology, SOC, SOH, or cross-cell prediction.'
  };
  const defaultThresholds = Object.freeze({
    peak_ratio_min: method.peak_to_residual_sd_minimum, area_allowance_factor: 1, increase_allowance_factor: 1,
    two_sided: 1, unresolved_followup_warn: 1
  });
  const thresholdKeys = Object.keys(defaultThresholds);
  const validThresholds = (profile) => profile && typeof profile === 'object' &&
    Object.keys(profile).length === thresholdKeys.length &&
    thresholdKeys.every((key) => Number.isFinite(profile[key]) && profile[key] >= 0);
  const thresholdsRef = (thresholds) => 'birmingham-qc-v1.1' +
    (thresholdKeys.every((key) => thresholds[key] === defaultThresholds[key]) ? '' : '-custom');

  // Validator from the organizer’s Explorer, scoped to the bundled packet schema.
  const packetValidator = (() => {
    const S = {};
    const typeOf = (v) => (v === null ? 'null' : Array.isArray(v) ? 'array' : Number.isInteger(v) ? 'integer' : typeof v);
    const matchesType = (v, t) => {
      const tv = typeOf(v);
      if (t === 'number') return tv === 'number' || tv === 'integer';
      return tv === t;
    };

    /** Validate data against a schema; returns [{path, message, keyword}] (empty = valid). */
    S.validate = (schema, data, path = '') => {
      const errs = [];
      const at = path || '(root)';
      if (schema === true || schema === undefined) return errs;
      if (schema === false) return [{ path: at, message: 'is not allowed', keyword: 'false' }];
      if (schema.type !== undefined) {
        const ts = Array.isArray(schema.type) ? schema.type : [schema.type];
        if (!ts.some((t) => matchesType(data, t))) {
          errs.push({ path: at, keyword: 'type', message: `${JSON.stringify(data)} is not of type ${ts.map((t) => `'${t}'`).join(', ')}` });
          return errs;
        }
      }
      if ('const' in schema && JSON.stringify(schema.const) !== JSON.stringify(data)) {
        errs.push({ path: at, keyword: 'const', message: `${JSON.stringify(schema.const)} was expected` });
      }
      if (schema.enum && !schema.enum.some((e) => JSON.stringify(e) === JSON.stringify(data))) {
        errs.push({ path: at, keyword: 'enum', message: `${JSON.stringify(data)} is not one of ${JSON.stringify(schema.enum)}` });
      }
      if (typeof data === 'string') {
        if (schema.minLength !== undefined && data.length < schema.minLength) errs.push({ path: at, keyword: 'minLength', message: `${JSON.stringify(data)} is too short` });
        if (schema.pattern && !(new RegExp(schema.pattern, 'u')).test(data)) errs.push({ path: at, keyword: 'pattern', message: `${JSON.stringify(data)} does not match '${schema.pattern}'` });
      }
      if (typeof data === 'number') {
        if (schema.minimum !== undefined && data < schema.minimum) errs.push({ path: at, keyword: 'minimum', message: `${data} is less than the minimum of ${schema.minimum}` });
        if (schema.maximum !== undefined && data > schema.maximum) errs.push({ path: at, keyword: 'maximum', message: `${data} is greater than the maximum of ${schema.maximum}` });
      }
      if (Array.isArray(data)) {
        if (schema.minItems !== undefined && data.length < schema.minItems) errs.push({ path: at, keyword: 'minItems', message: `array has ${data.length} items, at least ${schema.minItems} required` });
        if (schema.maxItems !== undefined && data.length > schema.maxItems) errs.push({ path: at, keyword: 'maxItems', message: `array has ${data.length} items, at most ${schema.maxItems} allowed` });
        if (schema.items) data.forEach((v, i) => errs.push(...S.validate(schema.items, v, `${path}[${i}]`)));
      }
      if (data && typeof data === 'object' && !Array.isArray(data)) {
        for (const r of schema.required || []) if (!(r in data)) errs.push({ path: at, keyword: 'required', message: `'${r}' is a required property` });
        for (const [k, sub] of Object.entries(schema.properties || {})) if (k in data) errs.push(...S.validate(sub, data[k], path ? `${path}.${k}` : k));
        if (schema.additionalProperties === false) {
          for (const k of Object.keys(data)) if (!(k in (schema.properties || {}))) errs.push({ path: at, keyword: 'additionalProperties', message: `additional property '${k}' is not allowed` });
        }
      }
      for (const sub of schema.allOf || []) errs.push(...S.validate(sub, data, path));
      if (schema.if) {
        const cond = S.validate(schema.if, data, path).length === 0;
        if (cond && schema.then) errs.push(...S.validate(schema.then, data, path));
        if (!cond && schema.else) errs.push(...S.validate(schema.else, data, path));
      }
      if (schema.not && S.validate(schema.not, data, path).length === 0) errs.push({ path: at, keyword: 'not', message: `${JSON.stringify(data)} should not be valid under ${JSON.stringify(schema.not)}` });
      return errs;
    };

    const RANK = { PASS: 0, WARN: 1, FAIL: 2 };
    const ALLOWED = { PASS: ['update'], WARN: ['update_with_warning', 'reject'], FAIL: ['reject'] };
    S.worst = (statuses) => statuses.reduce((w, s) => (RANK[s] > RANK[w] ? s : w), 'PASS');

    /** Rules the JSON Schema cannot express (identical to validate_packet.py). */
    S.packetSemantic = (p) => {
      const errs = [];
      if (p === null || typeof p !== 'object' || Array.isArray(p)) return errs;
      const checks = Array.isArray(p.qc_checks) ? p.qc_checks : [];
      if (checks.length) {
        const w = S.worst(checks.map((c) => c?.status).filter((s) => Object.hasOwn(RANK, s)));
        if (p.qc_status !== w) errs.push(`qc_status ${p.qc_status} but worst check is ${w}`);
      }
      const v = p.value, r = p.valid_range;
      if (typeof v === 'number' && Array.isArray(r) && r.length === 2 && !(r[0] <= v && v <= r[1])) errs.push(`value ${v} outside valid_range [${r[0]}, ${r[1]}]`);
      const act = (p.twin_action || {}).recommended;
      if (Object.hasOwn(ALLOWED, p.qc_status) && !ALLOWED[p.qc_status].includes(act)) errs.push(`twin_action ${act} not allowed for ${p.qc_status}`);
      if (p.origin === 'SIMULATED' && p.value_epistemic === 'MEASURED') errs.push('value of SIMULATED origin labelled MEASURED');
      return errs;
    };

    /** Full validation: schema + semantic rules. */
    S.validatePacket = (p, schema) => {
      const schemaErrors = schema ? S.validate(schema, p).map((e) => `${e.path}: ${e.message}`) : [];
      const semanticErrors = S.packetSemantic(p);
      return { valid: !schemaErrors.length && !semanticErrors.length, schemaErrors, semanticErrors };
    };
    return S;
  })();

  const timeBasis = {
    nmr_status: 'verified acquisition UTC windows',
    nmr_basis: 'TopSpin audita.txt start and completion checked against acqus DATE (≤ 1 s); zero is earliest start.',
    paper_milestones: { reference: 'Figure 6 (nominal charge times)', hours: { 63: 2, 67: 4 } },
    electrochemistry_status: 'tentative alignment; shared trigger unverified',
    electrochemistry_basis: 'Independent elapsed time; electrochemistry zero is placed at offset_s on the NMR clock.',
    voltage_rule: 'Linear interpolation within recorded electrochemistry support; null outside.'
  };
  const dictionary = {
    dictionary_version: '1.0',
    case_id: caseId,
    dataset,
    electrochemistry: {
      format: 'Headerless whitespace-delimited text.',
      columns: [
        { position: 1, field: 'elapsed_time', unit: 's', basis: 'Monotone elapsed values; hour-scale span agrees in order of magnitude with Figure 5c.' },
        { position: 2, field: 'current', unit: 'A', basis: 'Current-scale values and sign reversal across the formation cycle.' },
        { position: 3, field: 'cell_potential', unit: 'V', basis: 'Voltage-scale values and charge/discharge shape correspond to Figure 5c.' }
      ],
      column_status: 'INFERRED from numerical scale and the paper; underlying samples are MEASURED.'
    },
    nmr_window: { unit: 's', status: 'MEASURED audit time, UTC start/end; relative times DERIVED' },
    signed_integral: { field: 'value', observable: method.observable, unit, status: 'DERIVED from MEASURED processed NMR', method_version: method.version },
    method_sensitivity_allowance: { field: 'uncertainty.allowance', unit, status: 'DERIVED', meaning: method.uncertainty_kind },
    peak_to_residual_sd: { unit: '1', status: 'DERIVED exploratory peak/background ratio' },
    window_coverage: { unit: '1', status: 'DERIVED under tentative alignment' },
    midpoint_voltage: { unit: 'V', status: 'DERIVED under tentative alignment; null means no support' },
    qc_thresholds: { field: 'qc_thresholds', version: '1.0', status: 'ANALYST-SET', meaning: 'Numerical gate settings; the threshold set in a decision is retained on replay.' },
    qc_status: { values: ['PASS', 'WARN', 'FAIL'], status: 'INFERRED', meaning: 'Worst applicable check. WARN requires explicit acceptance; FAIL blocks the update.' },
    state: { unit, status: 'DERIVED latest accepted observation; gate decision INFERRED', meaning: 'The comparison starts at the selected baseline. An accepted follow-up becomes the current state; rejection preserves the prior state. Both decisions are recorded.' }
  };
  const expectedAcquisition = { NUC1: '23Na', TD: '512', RG: '101', NS: '32768', DTYPA: '0', BYTORDA: '0', AQ_mod: '3' };
  const expectedProcessing = { SI: '2048', LB: '1800', DTYPP: '0', BYTORDP: '0', PH_mod: '1', WDW: '1', BC_mod: '0', ME_mod: '0' };
  const acquisitionKeys = [...Object.keys(expectedAcquisition), 'SW_h', 'SFO1', 'PULPROG', 'PROBHD', 'DIGMOD', 'DECIM', 'DSPFVS', 'GRPDLY'];
  const processingKeys = [...Object.keys(expectedProcessing), 'SF', 'SW_p', 'OFFSET', 'NC_proc', 'PHC0', 'PHC1'];
  const phaseKeys = ['PHC0', 'PHC1'];
  const qcOwners = {
    chronological_windows: 'DS', matched_acquisition: 'PM', matched_processing: 'QE',
    stored_phase: 'QE', baseline_signal: 'QE', followup_signal: 'QE', increase_exceeds_allowance: 'DT', change_exceeds_allowance: 'DT'
  };
  const packetId = (spec) => 'E-t' + spec.id + '-na_metal_region';
  const inside = (value, [lo, hi]) => value >= lo && value <= hi;
  const midpoint = (lo, hi) => (lo + hi) / 2;
  const length = ([lo, hi]) => hi - lo;
  const requireCheck = (test, message) => { if (!test) throw new Error(message); };
  const differences = (first, next, keys) => keys.filter((key) => first[key] !== next[key]);
  const pick = (parameters, keys) => Object.fromEntries(keys.map((key) => [key, parameters.get(key) ?? null]));
  const sourcePath = (file) => file.webkitRelativePath.startsWith('Figure_5/') ?
    'online downloaded data/' + file.webkitRelativePath : file.webkitRelativePath;

  function parseAudit(log, unixEnd) {
    const times = [...log.matchAll(/^\(\s*\d+,<(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d\.\d{3} [+-]\d{4})>,[^\r\n]*<go4>,/gm)];
    const starts = [...log.matchAll(/\bstarted at (\d{4}-\d\d-\d\d \d\d:\d\d:\d\d\.\d{3} [+-]\d{4}),/g)];
    requireCheck(times.length === 1 && starts.length === 1, 'Expected one start and one completion in audita.txt.');
    const parse = (value) => Date.parse(value.replace(' ', 'T').replace(/ ([+-]\d\d)(\d\d)$/, '$1:$2'));
    const start = parse(starts[0][1]);
    const end = parse(times[0][1]);
    requireCheck(start < end && Math.abs(end - Number(unixEnd) * 1000) <= 1000, 'Audit times disagree with acqus DATE.');
    return { start, end };
  }

  function fitBaseline(x, y, bands) {
    const bins = [...x.keys()].filter((i) => bands.some((band) => inside(x[i], band)));
    requireCheck(bins.length > 2, 'Insufficient data in the baseline bands.');
    const xMean = bins.reduce((sum, i) => sum + x[i], 0) / bins.length;
    const yMean = bins.reduce((sum, i) => sum + y[i], 0) / bins.length;
    const xx = bins.reduce((sum, i) => sum + (x[i] - xMean) ** 2, 0);
    const xy = bins.reduce((sum, i) => sum + (x[i] - xMean) * (y[i] - yMean), 0);
    const slope = xy / xx;
    const corrected = y.map((value, i) => value - yMean - slope * (x[i] - xMean));
    const sumSq = bins.reduce((sum, i) => sum + corrected[i] ** 2, 0);
    const lagProduct = bins.reduce((sum, i, j) => sum + (bins[j - 1] === i - 1 ? corrected[i] * corrected[i - 1] : 0), 0);
    return { corrected, count: bins.length, sd: Math.sqrt(sumSq / (bins.length - 2)), lagOne: lagProduct / sumSq, slope, xMean, yMean };
  }

  function quantify(x, real, imaginary) {
    const { signal_window_ppm: window, sidebands_ppm: bands, sideband_shift_ppm: shift, phase_stress_deg: stress } = method;
    const bins = [...x.keys()].filter((i) => inside(x[i], window));
    requireCheck(bins.length >= 3, 'Insufficient data in the signal window.');
    const integrate = (y) => bins.slice(1).reduce((sum, i) => sum + (y[i] + y[i - 1]) * Math.abs(x[i] - x[i - 1]) / 2, 0);
    const baseline = fitBaseline(x, real, bands);
    const quadrature = fitBaseline(x, imaginary, bands);
    const area = integrate(baseline.corrected);
    const imagArea = integrate(quadrature.corrected);
    const candidates = [-shift, shift];
    const sidebandArea = candidates.flatMap((a) => candidates.map((b) => {
      const shifted = [bands[0].map((v) => v + a), bands[1].map((v) => v + b)];
      return integrate(fitBaseline(x, real, shifted).corrected);
    }));
    const theta = stress * Math.PI / 180;
    const rotatedArea = [-theta, theta].map((angle) => area * Math.cos(angle) - imagArea * Math.sin(angle));
    const maxDeviation = (areas) => Math.max(...areas.map((alt) => Math.abs(alt - area)));
    const noise = baseline.sd * length(window);
    const sideband = maxDeviation(sidebandArea);
    const phase = maxDeviation(rotatedArea);
    const allowance = noise + sideband + phase;
    const peak = bins.reduce((best, i) => baseline.corrected[i] > baseline.corrected[best] ? i : best);
    const ratio = baseline.corrected[peak] / baseline.sd;
    requireCheck(Number.isFinite(ratio) && Number.isFinite(allowance) && allowance > 0, 'Invalid signal or background estimate.');
    const peakInterior = peak !== bins[0] && peak !== bins.at(-1);
    const detected = peakInterior && ratio >= method.peak_to_residual_sd_minimum && area > allowance;
    const measurement = {
      area, allowance, detected,
      uncertainty_components: { noise, sideband, phase },
      peak_ppm: x[peak], peak_height_au: baseline.corrected[peak],
      imaginary_at_real_peak_au: quadrature.corrected[peak],
      peak_to_residual_sd: ratio, peak_interior: peakInterior,
      integrated_range_ppm: [x[bins.at(-1)], x[bins[0]]],
      sideband_points: baseline.count, residual_sd_au: baseline.sd, residual_lag1: baseline.lagOne,
      baseline_fit: { slope_au_per_ppm: baseline.slope, anchor_ppm: baseline.xMean, anchor_au: baseline.yMean }
    };
    return { measurement, corrected: baseline.corrected, imagCorrected: quadrature.corrected };
  }

  async function readAcquisition(experiment) {
    const id = Number(experiment.name.split('_').at(-1));
    const proc = experiment.processed.get('2');
    const file = (name) => experiment.files.get(name) || proc?.files.get(name);
    const names = ['acqus', 'audita.txt', 'fid', 'procs', '1r', '1i'];
    for (const name of names) requireCheck(file(name), `Missing ${name} for ${experiment.name} (requires pdata/2).`);
    const [acqus, audita, procs] = await Promise.all(['acqus', 'audita.txt', 'procs'].map((name) => reader.readText(file(name))));
    const aq = reader.parseParameters(acqus);
    const ps = reader.parseParameters(procs);
    const acquisition = pick(aq, acquisitionKeys);
    const processing = pick(ps, processingKeys);
    const unexpected = [...differences(expectedAcquisition, acquisition, Object.keys(expectedAcquisition)),
      ...differences(expectedProcessing, processing, Object.keys(expectedProcessing))];
    requireCheck(!unexpected.length, 'Unexpected parameters: ' + unexpected.join(', '));
    requireCheck(phaseKeys.every((key) => processing[key] !== null && Number.isFinite(Number(processing[key]))), 'Missing stored phase parameters.');
    const rawLayout = reader.rawLayout(file('fid'), aq);
    requireCheck(file('fid').size === rawLayout.bytes, 'Unexpected raw FID size.');
    const timing = parseAudit(audita, aq.get('DATE'));
    const layout = reader.spectrumLayout(file('1r'), ps);
    const imaginaryLayout = reader.spectrumLayout(file('1i'), ps);
    const [real, imaginary] = await Promise.all([reader.readSpectrum(file('1r'), layout, 0), reader.readSpectrum(file('1i'), imaginaryLayout, 0)]);
    const x = real.real.map((_, i) => real.start + i * real.step);
    const { measurement, corrected, imagCorrected } = quantify(x, real.real, imaginary.real);
    const sizes = Object.fromEntries(names.map((name) => [name, file(name).size]));
    const extra = { ABSG: ps.get('ABSG') ?? null, ABSF1: ps.get('ABSF1') ?? null, ABSF2: ps.get('ABSF2') ?? null };
    const paths = Object.fromEntries(names.map((name) => [name, sourcePath(file(name))]));
    return { id, x, real: real.real, corrected, imagCorrected, sizes, extra, timing, paths, acquisition, processing, measurement,
      raw_complex_points: rawLayout.words / 2, acqus_date_unix_s: Number(aq.get('DATE')) };
  }

  function readElectrochemistry(raw, path) {
    const rows = [];
    let last = -Infinity;
    for (const [index, line] of raw.trim().split(/\r?\n/).entries()) {
      const row = line.trim().split(/\s+/).map(Number);
      requireCheck(row.length === 3 && row.every(Number.isFinite) && row[0] > last,
        `Invalid electrochemistry row ${index + 1}. Expected three finite values and increasing time.`);
      rows.push(row);
      last = row[0];
    }
    requireCheck(rows.length >= 2, 'Electrochemistry must include at least two rows.');
    return { path, rows, first: rows[0][0], last };
  }

  async function load(files) {
    const groups = reader.catalog(files).filter((sample) => sample.name === figure);
    requireCheck(groups.length === 1, 'Select the extracted Figure_5 folder.');
    const sample = groups[0];
    const expected = Array.from({ length: 16 }, (_, i) => `Na_fullSpectrum_${i + 60}`);
    const missing = expected.filter((name) => !sample.experiments.has(name));
    requireCheck(!missing.length, 'Missing spectra: ' + missing.join(', '));
    const electroFile = [...files].find((file) => file.webkitRelativePath === sample.path + '/' + chemistryFile);
    requireCheck(electroFile, 'Missing ' + chemistryFile + '.');
    const readings = await Promise.all(expected.map(async (name) => {
      try { return await readAcquisition(sample.experiments.get(name)); }
      catch (error) { throw new Error(name + ' — ' + error.message); }
    }));
    readings.sort((a, b) => a.timing.start - b.timing.start);
    const zero = readings[0].timing.start;
    for (const [index, spec] of readings.entries()) {
      const { start, end } = spec.timing;
      requireCheck(index === 0 || readings[index - 1].timing.end <= start, 'Unexpected overlap between audited NMR windows.');
      spec.window = [(start - zero) / 1000, (end - zero) / 1000];
      spec.mid = midpoint(...spec.window);
    }
    const electrochemistry = readElectrochemistry(await reader.readText(electroFile), sourcePath(electroFile));
    return { readings, zero, electrochemistry };
  }

  function midpointVoltage(electro, relativeTime) {
    if (!inside(relativeTime, [electro.first, electro.last])) return null;
    const { rows } = electro;
    let lo = 0;
    let hi = rows.length - 1;
    while (hi - lo > 1) {
      const middle = Math.floor(midpoint(lo, hi));
      if (rows[middle][0] <= relativeTime) lo = middle;
      else hi = middle;
    }
    const [t0, , v0] = rows[lo];
    const [t1, , v1] = rows[hi];
    return v0 + (v1 - v0) * (relativeTime - t0) / (t1 - t0);
  }

  function alignment(electro, spec, offset) {
    const [start, end] = spec.window;
    const overlap = Math.max(0, Math.min(end, electro.last + offset) - Math.max(start, electro.first + offset));
    return { overlap_fraction: overlap / (end - start), midpoint_voltage_v: midpointVoltage(electro, spec.mid - offset) };
  }

  function signalDetected(measurement, thresholds) {
    return measurement.peak_interior && measurement.peak_to_residual_sd >= thresholds.peak_ratio_min &&
      measurement.area > thresholds.area_allowance_factor * measurement.allowance;
  }

  function evaluate(base, follow, thresholds = defaultThresholds) {
    const before = base.measurement;
    const after = follow.measurement;
    const delta = after.area - before.area;
    const allowance = after.allowance + before.allowance;
    const acquisitionDifferences = differences(base.acquisition, follow.acquisition, acquisitionKeys);
    const processDifferences = differences(base.processing, follow.processing, processingKeys.filter((key) => !phaseKeys.includes(key)));
    const phaseDifferences = differences(base.processing, follow.processing, phaseKeys);
    const gap = (follow.timing.start - base.timing.end) / 1000;
    const baselineDetected = signalDetected(before, thresholds);
    const followupDetected = signalDetected(after, thresholds);
    const increaseLimit = thresholds.increase_allowance_factor * allowance;
    const areaFactor = thresholds.area_allowance_factor === 1 ? '' : thresholds.area_allowance_factor + ' × ';
    const signalRule = 'Interior peak, peak/background ratio ≥ ' + thresholds.peak_ratio_min +
      ' and signed area > ' + areaFactor + 'sensitivity allowance.';
    const increaseReason = thresholds.increase_allowance_factor === 1 ?
      'The positive increment must exceed the sum of both allowances.' :
      'The positive increment must exceed ' + thresholds.increase_allowance_factor + ' × the sum of both allowances.';
    const checks = [
      { name: 'chronological_windows', value: gap, unit: 's', threshold: '≥ 0',
        status: gap >= 0 ? 'PASS' : 'FAIL', reason: 'Follow-up must start at or after the baseline window ends.' },
      { name: 'matched_acquisition', value: acquisitionDifferences.length, unit: '1', threshold: '0 differing parameters',
        status: acquisitionDifferences.length ? 'FAIL' : 'PASS', reason: acquisitionDifferences.length ? 'Acquisition parameters differ: ' + acquisitionDifferences.join(', ') + '.' : 'Checked acquisition parameters match.' },
      { name: 'matched_processing', value: processDifferences.length, unit: '1', threshold: '0 differing non-phase parameters',
        status: processDifferences.length ? 'FAIL' : 'PASS', reason: processDifferences.length ? 'Non-phase processing parameters differ: ' + processDifferences.join(', ') + '.' : 'Checked non-phase processing parameters match.' },
      { name: 'stored_phase', value: phaseDifferences.length, unit: '1', threshold: '0 differing phase parameters',
        status: phaseDifferences.length ? 'WARN' : 'PASS', reason: phaseDifferences.length ? 'Stored phase differs (' + phaseDifferences.join(', ') + '). Local rotation tests do not resolve the full phase uncertainty.' : 'Stored phase parameters match.' },
      { name: 'baseline_signal', value: baselineDetected, unit: '1', threshold: signalRule,
        status: baselineDetected ? 'PASS' : 'WARN', reason: baselineDetected ? 'Baseline passes the exploratory signal rule.' : 'Baseline is background or unresolved under the rule. The signed area is retained with its allowance.' },
      { name: 'followup_signal', value: followupDetected, unit: '1', threshold: signalRule,
        status: followupDetected ? 'PASS' : thresholds.unresolved_followup_warn ? 'WARN' : 'FAIL', reason: followupDetected ? 'Follow-up passes the exploratory signal rule.' : thresholds.unresolved_followup_warn ? 'Follow-up does not pass the exploratory peak and area rule; it is recorded as a signal at or below the detection rule.' : 'Follow-up does not pass the exploratory peak and area rule.' },
      thresholds.two_sided ? { name: 'change_exceeds_allowance', value: delta, unit, threshold: '|Δ| > ' + increaseLimit,
        status: Math.abs(delta) > increaseLimit ? 'PASS' : 'FAIL',
        reason: (delta >= 0 ? 'Increase' : 'Decrease') + ' of the signed area; the change in either direction must exceed ' + (thresholds.increase_allowance_factor === 1 ? '' : thresholds.increase_allowance_factor + ' × ') + 'the sum of both allowances.' }
        : { name: 'increase_exceeds_allowance', value: delta, unit, threshold: '> ' + increaseLimit,
        status: delta > increaseLimit ? 'PASS' : 'FAIL', reason: increaseReason }
    ];
    const status = checks.some((check) => check.status === 'FAIL') ? 'FAIL' : checks.some((check) => check.status === 'WARN') ? 'WARN' : 'PASS';
    return { status, checks: checks.map((check) => ({ ...check, owner: qcOwners[check.name] })), delta, allowance, unit };
  }

  function packet(spec, qc, thresholds = defaultThresholds) {
    const reasons = qc.checks.filter((check) => check.status !== 'PASS').map((check) => check.reason);
    return {
      packet_version: '1.0',
      packet_id: packetId(spec),
      subject_id: 'sub-BirminghamF5',
      session_id: 'ses-NaFullSpectrum' + spec.id,
      relative_time: { value: spec.mid, unit: 's', window: spec.window },
      acquisition_utc: { start: new Date(spec.timing.start).toISOString(), end: new Date(spec.timing.end).toISOString(), acqus_date_unix_s: spec.acqus_date_unix_s },
      origin: 'MEASURED', value_epistemic: 'DERIVED', decision_epistemic: 'INFERRED',
      modality: 'MRS',
      spatial_reference: { frame: 'named_region', region: 'Whole-cell ²³Na spectrum' },
      observable: method.observable, value: spec.measurement.area, unit,
      source_object: spec.paths['1r'],
      source_sha256: null,
      acquisition_context: { nucleus: spec.acquisition.NUC1, sequence: spec.acquisition.PULPROG,
        spectrometer_frequency_MHz: Number(spec.acquisition.SFO1), averages: Number(spec.acquisition.NS),
        raw_complex_points: spec.raw_complex_points, stored_parameters: spec.acquisition },
      processing: { pipeline: 'Birmingham Figure 5 local integral', ...method, stored_parameters: spec.processing },
      uncertainty: { type: 'category', value: 'Method sensitivity allowance',
        allowance: spec.measurement.allowance, unit, components: spec.measurement.uncertainty_components },
      diagnostic: { ...spec.measurement, detected: signalDetected(spec.measurement, thresholds) },
      thresholds_ref: thresholdsRef(thresholds), qc_thresholds: thresholds,
      qc_status: qc.status, qc_checks: qc.checks, qc_reasons: reasons,
      provenance: { dataset, publication, parents: Object.values(spec.paths),
        activities: ['Read and scale Bruker proc 2', 'Verify audited acquisition window', 'Fit sideband background', 'Integrate and apply quality checks'] },
      twin_action: {
        recommended: qc.status === 'FAIL' ? 'reject' : qc.status === 'WARN' ? 'update_with_warning' : 'update',
        reason: reasons.join(' ') || 'All applicable NMR quality checks passed.'
      },
      interpretation_limit: method.limits
    };
  }

  /* State helpers (same records as the team's Birmingham Explorer). */
  const iso0 = (ms) => new Date(ms).toISOString();
  const policyText = 'Acceptance sets the state to the reviewed follow-up. Rejection preserves the prior state. The selected baseline defines the evidence comparison.';
  function stateFor(spec, thresholds = S.thresholds) {
    return { acquisition: spec.id, packet_id: packetId(spec), midpoint_nmr_s: spec.mid,
      value: spec.measurement.area, allowance: spec.measurement.allowance, unit,
      resolved: signalDetected(spec.measurement, thresholds), value_epistemic: 'DERIVED' };
  }
  function alignmentSnapshot(updateOffset = S.offset) {
    const electro = S.data.electrochemistry;
    return {
      ...timeBasis, nmr_zero_utc: iso0(S.data.zero), offset_s: updateOffset,
      source_object: electro.path, origin: 'MEASURED',
      native_extent_s: [electro.first, electro.last], row_count: electro.rows.length,
      windows: S.data.readings.map((spec) => ({ acquisition: spec.id, start_utc: iso0(spec.timing.start),
        end_utc: iso0(spec.timing.end), window_nmr_s: spec.window, midpoint_nmr_s: spec.mid,
        audit_source: spec.paths['audita.txt'], acqus_date_unix_s: spec.acqus_date_unix_s,
        ...alignment(electro, spec, updateOffset) }))
    };
  }
  function actionFor(status) {
    return status === 'FAIL' ? 'rejected' : status === 'WARN' ? 'accepted_with_warning' : 'accepted';
  }
  function eventRecord(previous, comparison, gate, action, recordedAt, context, thresholds = S.thresholds) {
    const before = previous?.after ?? comparison.baseline;
    return {
      event_number: (previous?.event_number ?? 0) + 1,
      recorded_at_utc: recordedAt, action, policy: policyText, comparison,
      before, after: action === 'rejected' ? before : comparison.followup, gate,
      electrochemistry_context_at_update: context,
      decision_epistemic: 'INFERRED', qc_thresholds: { ...thresholds }, thresholds_ref: thresholdsRef(thresholds)
    };
  }

  /* ================================================================ state */
  const S = {
    data: null, study: null, offset: 0, history: [], verified: true, notice: '',
    selected: 63, stack: { mode: 'heat', range: 'full', gain: 1, contrast: 12 },
    tourTwinStep: 4, phaseDeg: 0, scenarioK: 1, provNode: '1r', workTab: 'spectra', inspectFile: null,
    thresholds: null, valText: null, valOut: '', extra: {},
    viz: { idx: 3, range: 'full', diff: false, ref: 60, playing: null, f7range: 'full', f7norm: 'electrolyte', f7show: { charged: true, rest: true, discharged: true }, f7fig5: 'none', f6: 63, f6range: 'full' }
  };
  S.thresholds = { ...defaultThresholds };
  const historyKey = 'mdx-team-v1.0-zh:' + caseId + ':history:v1';
  const decisionLabel = { accepted: 'Accepted', accepted_with_warning: 'Accepted with warning', rejected: 'Rejected' };
  const policy = 'Acceptance sets the state to the reviewed follow-up. Rejection preserves the prior state. FAIL cannot be accepted. WARN needs explicit acceptance of each reason.';
  const checkLabels = {
    chronological_windows: 'Windows in time order', matched_acquisition: 'Same acquisition settings',
    matched_processing: 'Same processing (except phase)', stored_phase: 'Same stored phase',
    baseline_signal: 'Baseline signal resolved', followup_signal: 'Follow-up signal resolved',
    increase_exceeds_allowance: '增量大于两者容差之和',
    change_exceeds_allowance: '变化（任一方向）大于两者容差之和'
  };
  const trackName = { QE: '量子工程', PM: '精密机械 / 计量', DS: '数据科学', DT: '数字孪生' };
  const trackQ = { QE: '信号从哪里来？', PM: '这个数有多准？', DS: '它如何存储和传递？', DT: '我们现在相信什么？下一步测什么？' };
  const REG = { quasi: [150, 900], metal: [1000, 1250] };
  const RANGES = { full: [-250, 1450], quasi: [100, 950], metal: [920, 1260] };

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const iso = (ms) => new Date(ms).toISOString();
  const M = (v) => (v / 1e6).toFixed(2);
  const Ms = (v) => (v >= 0 ? '+' : '−') + Math.abs(v / 1e6).toFixed(2);
  const pm = (v, a) => `${Ms(v)} ± ${M(a)}`;
  const h = (s) => (s / 3600).toFixed(2);
  const ep = (k) => `<span class="chip ep ${k}">${k}</span>`;
  const trk = (t) => `<span class="chip trk ${t}" title="${trackName[t]}">${t}</span>`;
  const status = (s) => `<span class="chip ${s}">${s === 'PASS' ? '✓' : s === 'WARN' ? '!' : '✕'} ${s}</span>`;
  const byId = (id) => S.data?.readings.find((r) => r.id === Number(id));
  const pair = (a, b) => `#${a} → #${b}`;
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];

  function toast(text) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = text; t.setAttribute('role', 'status');
    document.body.append(t); setTimeout(() => t.remove(), 3200);
  }

  /* ================================================================ study, twin and history */
  function setStudy(baseId, followId) {
    const base = byId(baseId), follow = byId(followId);
    if (!base || !follow) return;
    S.study = { base, follow, gate: evaluate(base, follow, S.thresholds), event: null };
    S.valText = null; S.valOut = '';
  }
  function currentState() { return S.history.at(-1)?.after ?? stateFor(S.study.base); }
  function recordDecision(accept) {
    const { base, follow, gate, event } = S.study;
    if (!S.verified || event || (accept && gate.status === 'FAIL')) return;
    const next = eventRecord(S.history.at(-1), { baseline: stateFor(base), followup: stateFor(follow) }, gate,
      accept ? actionFor(gate.status) : 'rejected', iso(Date.now()), alignmentSnapshot());
    S.history = [...S.history, next];
    S.study.event = next;
    saveHistory();
    toast(next.action === 'rejected' ? 'Recorded: rejected. The twin state is unchanged.' : `Recorded: ${decisionLabel[next.action]}. Twin state is now #${next.after.acquisition}.`);
    render();
  }
  function resetTwin() {
    S.history = []; if (S.study) S.study.event = null; saveHistory(); render();
  }
  function saveHistory() {
    try { localStorage.setItem(historyKey, JSON.stringify({ history_version: '1.0', case_id: caseId, method_version: method.version, events: S.history })); S.notice = ''; }
    catch { S.notice = 'Browser storage is unavailable; the audit log lives in this tab only. Export the bundle to keep it.'; }
  }
  function restoreHistory() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(historyKey) || 'null'); } catch { saved = null; }
    if (!saved || !Array.isArray(saved.events) || saved.method_version !== method.version) { S.history = []; return; }
    // Re-verify every stored event against the files that were just loaded.
    let prior = null;
    try {
      for (const event of saved.events) {
        const base = byId(event.comparison.baseline.acquisition), follow = byId(event.comparison.followup.acquisition);
        const thr = validThresholds(event.qc_thresholds) ? event.qc_thresholds : defaultThresholds;
        const gate = evaluate(base, follow, thr);
        const expected = eventRecord(prior, { baseline: stateFor(base, thr), followup: stateFor(follow, thr) }, gate, event.action, event.recorded_at_utc,
          alignmentSnapshot(event.electrochemistry_context_at_update.offset_s), thr);
        if ((gate.status === 'FAIL' && event.action !== 'rejected') || JSON.stringify(event) !== JSON.stringify(expected)) throw new Error('mismatch');
        prior = expected;
      }
      S.history = saved.events;
      if (S.history.length) S.notice = `Restored ${S.history.length} recorded decision(s); each was re-verified against the loaded files.`;
    } catch {
      S.history = []; S.notice = 'A saved audit log did not reproduce from these files and was not used.';
    }
  }

  /* ================================================================ exports */
  function downloadJson(filename, payload) {
    const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2) + '\n'], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function buildBundle() {
    const { base, follow, gate, event } = S.study;
    const baselineQc = gate.checks.filter((c) => c.name === 'baseline_signal');
    return {
      schema_version: '1.0', case_id: caseId,
      sources: { dataset, publication, challenge: 'Dossier v1.6 §§8.5, 9.7' },
      data_dictionary: dictionary, method, alignment: alignmentSnapshot(),
      dataset_inventory: S.data.readings.map((spec) => ({ acquisition: spec.id, paths: spec.paths,
        acquisition_parameters: spec.acquisition, processing_parameters: spec.processing,
        raw_complex_points: spec.raw_complex_points, origin: 'MEASURED' })),
      baseline_packet: packet(base, { status: baselineQc[0].status, checks: baselineQc }, S.thresholds),
      followup_packet: packet(follow, gate, S.thresholds), qc_thresholds: S.thresholds, thresholds_ref: thresholdsRef(S.thresholds),
      gate, current_state: currentState(),
      update_record: event && event.action !== 'rejected' ? event : null,
      decision_record: event, history_verified: S.verified, decision_history: S.history
    };
  }
  const exporters = {
    bundle: () => downloadJson(`Birmingham-Figure5-${S.study.base.id}-to-${S.study.follow.id}.json`, buildBundle()),
    packet: () => downloadJson(`${packetId(S.study.follow)}.json`, packet(S.study.follow, S.study.gate, S.thresholds)),
    thresholds: () => downloadJson(`${thresholdsRef(S.thresholds)}.json`, { id: thresholdsRef(S.thresholds), case_id: caseId, method_version: method.version, thresholds: S.thresholds, status: 'INFERRED (team choice)' }),
    dictionary: () => downloadJson('Birmingham-Figure5-data-dictionary.json', dictionary),
    update: () => downloadJson('Birmingham-Figure5-audit-log.json', { case_id: caseId, policy, current_state: currentState(), events: S.history })
  };

  /* ================================================================ charts */
  function setup(cv) {
    const w = cv.clientWidth, hgt = cv.clientHeight;
    if (!w || !hgt) return null;
    const r = window.devicePixelRatio || 1;
    const W = Math.round(w * r), HH = Math.round(hgt * r);
    if (cv.width !== W || cv.height !== HH) { cv.width = W; cv.height = HH; }
    const ctx = cv.getContext('2d');
    ctx.setTransform(r, 0, 0, r, 0, 0);
    const cs = getComputedStyle(document.documentElement);
    const c = (n) => cs.getPropertyValue('--' + n).trim();
    ctx.font = '11px ' + c('font-ui');
    ctx.fillStyle = c('surface'); ctx.fillRect(0, 0, w, hgt);
    return { ctx, w, h: hgt, c };
  }
  const lin = (a0, a1, b0, b1) => (v) => b0 + (v - a0) / (a1 - a0) * (b1 - b0);
  function ticks(lo, hi, n = 5) {
    const raw = (hi - lo) / n, p = 10 ** Math.floor(Math.log10(raw));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * p).find((s) => s >= raw) || raw;
    const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toPrecision(12)); return out;
  }
  function frame(g, f, xt, yt, X, Y, xf, yf, xl, yl) {
    const { ctx, c } = g;
    ctx.lineWidth = 1; ctx.strokeStyle = c('line'); ctx.fillStyle = c('muted');
    ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
    for (const v of yt) { const y = Y(v); ctx.beginPath(); ctx.moveTo(f.l, y); ctx.lineTo(f.r, y); ctx.stroke(); ctx.fillText(yf(v), f.l - 6, y); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (const v of xt) { const x = X(v); ctx.beginPath(); ctx.moveTo(x, f.t); ctx.lineTo(x, f.b); ctx.stroke(); if (xf) ctx.fillText(xf(v), x, f.b + 5); }
    ctx.strokeStyle = c('line-strong'); ctx.strokeRect(f.l, f.t, f.r - f.l, f.b - f.t);
    ctx.fillStyle = c('ink-2');
    if (xl) { ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(xl, (f.l + f.r) / 2, g.h - 3); }
    if (yl) { ctx.save(); ctx.translate(12, (f.t + f.b) / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(yl, 0, 0); ctx.restore(); }
  }
  function regionBands(g, f, X, opts = {}) {
    const { ctx, c } = g;
    const bands = [
      [REG.quasi, 'purple-soft', 'purple-text', 'quasi-metallic region 150–900 ppm', 'quasi-metallic'],
      [REG.metal, 'orange-soft', 'orange-text', 'metal region 1000–1250 ppm', 'metal']
    ];
    for (const [[lo, hi], fill, ink, long, short] of bands) {
      const a = Math.max(f.l, Math.min(X(lo), X(hi))), b = Math.min(f.r, Math.max(X(lo), X(hi)));
      if (b <= a) continue;
      ctx.fillStyle = c(fill); ctx.globalAlpha = opts.alpha ?? 1; ctx.fillRect(a, f.t, b - a, f.b - f.t); ctx.globalAlpha = 1;
      ctx.font = '600 10.5px ' + c('font-ui');
      const label = ctx.measureText(long).width < b - a - 6 ? long : short;
      if (opts.labels !== false) { ctx.fillStyle = c(ink); ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.font = '600 10.5px ' + c('font-ui'); ctx.fillText(label, (a + b) / 2, f.t + 3); ctx.font = '11px ' + c('font-ui'); }
    }
  }
  // Pixel-binned polyline that keeps the extremes inside each pixel column.
  function trace(ctx, xs, ys, X, Y, lo, hi) {
    ctx.beginPath();
    let started = false, px = null, mn = 0, mx = 0, first = 0, last = 0;
    const flush = () => { if (px === null) return; const pts = [first, mn, mx, last]; for (const v of pts) { if (!started) { ctx.moveTo(px, Y(v)); started = true; } else ctx.lineTo(px, Y(v)); } };
    for (let i = 0; i < xs.length; i++) {
      if (xs[i] < lo || xs[i] > hi) continue;
      const p = Math.round(X(xs[i]));
      if (p !== px) { flush(); px = p; mn = mx = first = last = ys[i]; }
      else { mn = Math.min(mn, ys[i]); mx = Math.max(mx, ys[i]); last = ys[i]; }
    }
    flush(); ctx.stroke();
  }

  function drawSpectra(cv, o) {
    const g = setup(cv); if (!g) return;
    const { ctx, c, w, h: H } = g;
    const [lo, hi] = o.range;
    const f = { l: 56, r: w - 14, t: 16, b: H - 34 };
    const X = lin(hi, lo, f.l, f.r);
    let mn = 0, mx = 0;
    for (const t of o.traces) t.x.forEach((p, i) => { if (p >= lo && p <= hi) { mn = Math.min(mn, t.y[i]); mx = Math.max(mx, t.y[i]); } });
    if (o.yRange) [mn, mx] = o.yRange;
    const pad = (mx - mn || 1) * .08;
    const Y = lin(mn - pad, mx + pad, f.b, f.t);
    if (o.regions) regionBands(g, f, X);
    for (const b of o.bands || []) { ctx.fillStyle = c(b.color); ctx.fillRect(Math.min(X(b.range[0]), X(b.range[1])), f.t, Math.abs(X(b.range[1]) - X(b.range[0])), f.b - f.t); if (b.label) { ctx.fillStyle = c(b.ink || 'ink-2'); ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(b.label, (X(b.range[0]) + X(b.range[1])) / 2, f.t + 3); } }
    const exp = Math.floor(Math.log10(Math.max(Math.abs(mn), Math.abs(mx)) || 1));
    frame(g, f, ticks(lo, hi, 7), ticks(mn - pad, mx + pad, 4), X, Y, (v) => String(v), (v) => (v / 10 ** exp).toFixed(1), '²³Na chemical shift (ppm)', `intensity ×10^${exp} (a.u.)`);
    ctx.strokeStyle = c('line-strong'); ctx.beginPath(); ctx.moveTo(f.l, Y(0)); ctx.lineTo(f.r, Y(0)); ctx.stroke();
    if (o.fill) {
      const { x, y, range: [a, b], color } = o.fill;
      ctx.fillStyle = c(color); ctx.globalAlpha = .45; ctx.beginPath(); let s = false;
      x.forEach((p, i) => { if (p >= a && p <= b) { if (!s) { ctx.moveTo(X(p), Y(0)); s = true; } ctx.lineTo(X(p), Y(y[i])); } });
      const end = x.filter((p) => p >= a && p <= b); ctx.lineTo(X(end.at(-1)), Y(0)); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    }
    ctx.save(); ctx.beginPath(); ctx.rect(f.l, f.t, f.r - f.l, f.b - f.t); ctx.clip();
    for (const t of o.traces) { ctx.strokeStyle = c(t.color); ctx.lineWidth = t.width || 1.5; ctx.setLineDash(t.dash || []); trace(ctx, t.x, t.y, X, Y, lo, hi); }
    ctx.setLineDash([]); ctx.restore();
    if (o.readout) cv.onmousemove = (e) => {
      const r = cv.getBoundingClientRect(), px = e.clientX - r.left;
      if (px < f.l || px > f.r) return;
      const ppm = lo + (f.r - px) / (f.r - f.l) * (hi - lo);
      const vals = o.traces.filter((t) => t.label).map((t) => { let k = 0; t.x.forEach((p, i) => { if (Math.abs(p - ppm) < Math.abs(t.x[k] - ppm)) k = i; }); return `${t.label} ${(t.y[k] / 1e3).toFixed(1)}×10³`; });
      o.readout.textContent = `${ppm.toFixed(0)} ppm · ${vals.join(' · ')} a.u.`;
    };
  }

  function rgb(hex) { const m = hex.replace('#', ''); return [0, 2, 4].map((i) => parseInt(m.slice(i, i + 2), 16)); }
  const HEAT_CACHE = new Map();
  function drawHeat(cv, o) {
    const g = setup(cv); if (!g) return;
    const { ctx, c, w, h: H } = g;
    const rs = S.data.readings;
    const [lo, hi] = o.range;
    const f = { l: 56, r: w - 70, t: 22, b: H - 34 };
    const X = lin(hi, lo, f.l, f.r);
    const tEnd = rs.at(-1).window[1];
    const Y = lin(0, tEnd, f.t, f.b);
    let max = 0;
    for (const r of rs) r.x.forEach((p, i) => { if (p >= lo && p <= hi) max = Math.max(max, Math.abs(r.real[i])); });
    const s = max / (o.contrast || 40);
    const norm = (v) => Math.asinh(v / s) / Math.asinh(max / s);
    const bg = rgb(c('surface')), pos = rgb(c('orange')), deep = rgb(c('ink')), neg = rgb(c('blue'));
    const col = (v) => {
      const t = Math.max(-1, Math.min(1, norm(v)));
      let to; let k;
      if (t >= 0) { if (t < .6) { to = pos; k = t / .6; } else { const a = (t - .6) / .4; return `rgb(${pos.map((p, i) => Math.round(p + (deep[i] - p) * a)).join(',')})`; } }
      else { to = neg; k = -t; }
      return `rgb(${bg.map((b, i) => Math.round(b + (to[i] - b) * k)).join(',')})`;
    };
    ctx.fillStyle = c('surface-2'); ctx.fillRect(f.l, f.t, f.r - f.l, f.b - f.t);
    const pw = Math.max(1, Math.round(f.r - f.l)), phh = Math.max(1, Math.round(f.b - f.t));
    const hkey = [lo, hi, o.contrast, pw, phh, c('surface'), c('orange'), c('blue'), c('ink')].join('|');
    let img = HEAT_CACHE.get(hkey);
    if (!img) {
      const colRGB = (v) => { const t = Math.max(-1, Math.min(1, norm(v))); if (t >= .6) { const a = (t - .6) / .4; return pos.map((p, i) => p + (deep[i] - p) * a); } const to = t >= 0 ? pos : neg, k = t >= 0 ? t / .6 : -t; return bg.map((b, i) => b + (to[i] - b) * k); };
      img = document.createElement('canvas'); img.width = pw; img.height = phh;
      const ic = img.getContext('2d'), id = ic.createImageData(pw, phh), d = id.data;
      for (let y = 0; y < phh; y++) {
        const t = (y + .5) / phh * tEnd, r = rs.find((q) => t >= q.window[0] && t <= q.window[1]);
        if (!r) continue;
        const x0 = r.x[0], dx = r.x[1] - r.x[0];
        for (let x = 0; x < pw; x++) {
          const ppm = hi - (x + .5) / pw * (hi - lo), k = Math.round((ppm - x0) / dx);
          if (k < 0 || k >= r.real.length) continue;
          const [R, G, B] = colRGB(r.real[k]), o4 = (y * pw + x) * 4;
          d[o4] = R; d[o4 + 1] = G; d[o4 + 2] = B; d[o4 + 3] = 255;
        }
      }
      ic.putImageData(id, 0, 0);
      if (HEAT_CACHE.size > 12) HEAT_CACHE.clear();
      HEAT_CACHE.set(hkey, img);
    }
    ctx.imageSmoothingEnabled = false; ctx.drawImage(img, f.l, f.t, f.r - f.l, f.b - f.t);
    for (const r of rs) {
      const y0 = Y(r.window[0]), y1 = Y(r.window[1]);
      ctx.fillStyle = c('muted'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      const mark = o.mark?.[r.id];
      ctx.font = (mark ? '700 ' : '') + '11px ' + c('font-ui');
      ctx.fillStyle = mark ? c(mark) : c('muted');
      ctx.fillText('#' + r.id, f.r + 6, (y0 + y1) / 2);
      if (mark) { ctx.strokeStyle = c(mark); ctx.lineWidth = 2; ctx.strokeRect(f.l + 1, y0, f.r - f.l - 2, y1 - y0); ctx.lineWidth = 1; }
    }
    ctx.font = '11px ' + c('font-ui');
    for (const [[a, b], ink, label] of [[REG.quasi, 'purple-text', 'quasi-metallic'], [REG.metal, 'orange-text', 'metal']]) {
      if (b < lo || a > hi) continue;
      ctx.strokeStyle = c(ink); ctx.setLineDash([4, 3]);
      for (const v of [a, b]) if (v >= lo && v <= hi) { ctx.beginPath(); ctx.moveTo(X(v), f.t - 4); ctx.lineTo(X(v), f.b); ctx.stroke(); }
      ctx.setLineDash([]); ctx.fillStyle = c(ink); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.font = '600 10.5px ' + c('font-ui');
      ctx.fillText(label, X((Math.max(a, lo) + Math.min(b, hi)) / 2), f.t - 6); ctx.font = '11px ' + c('font-ui');
    }
    const yt = ticks(0, tEnd / 3600, 6).map((v) => v * 3600);
    frame(g, f, ticks(lo, hi, 7), yt, X, Y, String, (v) => (v / 3600).toFixed(0), '²³Na chemical shift (ppm)', 'time from first NMR start (h)');
    // colour bar
    const cbx = f.r + 44, cbh = f.b - f.t;
    for (let i = 0; i < cbh; i++) { const t = 1 - 2 * i / cbh; const v = Math.sign(t) * s * Math.sinh(Math.abs(t) * Math.asinh(max / s)); ctx.fillStyle = col(v); ctx.fillRect(cbx, f.t + i, 10, 1.5); }
    ctx.fillStyle = c('muted'); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('+', cbx + 5, f.t - 2); ctx.textBaseline = 'top'; ctx.fillText('−', cbx + 5, f.b + 2);
    cv.onmousemove = (e) => {
      const b = cv.getBoundingClientRect(), px = e.clientX - b.left, py = e.clientY - b.top;
      const t = (py - f.t) / (f.b - f.t) * tEnd;
      const r = rs.find((q) => t >= q.window[0] && t <= q.window[1]);
      if (!r || px < f.l || px > f.r) { cv.style.cursor = 'default'; return; }
      cv.style.cursor = 'pointer';
      const ppm = lo + (f.r - px) / (f.r - f.l) * (hi - lo);
      let k = 0; r.x.forEach((p, i) => { if (Math.abs(p - ppm) < Math.abs(r.x[k] - ppm)) k = i; });
      if (o.readout) o.readout.textContent = `#${r.id} · midpoint ${h(r.mid)} h · ${ppm.toFixed(0)} ppm · ${(r.real[k] / 1e3).toFixed(1)}×10³ a.u. (pdata/2 1r)`;
    };
    cv.onclick = (e) => {
      const b = cv.getBoundingClientRect(), t = (e.clientY - b.top - f.t) / (f.b - f.t) * tEnd;
      const r = rs.find((q) => t >= q.window[0] - 150 && t <= q.window[1] + 150);
      if (r && o.onPick) o.onPick(r.id);
    };
  }

  function drawStack(cv, o) {
    const g = setup(cv); if (!g) return;
    const { ctx, c, w, h: H } = g;
    const rs = S.data.readings;
    const [lo, hi] = o.range;
    const f = { l: 56, r: w - 14, t: 22, b: H - 34 };
    const X = lin(hi, lo, f.l, f.r);
    let max = 0;
    for (const r of rs) r.x.forEach((p, i) => { if (p >= lo && p <= hi) max = Math.max(max, Math.abs(r.real[i])); });
    const tEnd = rs.at(-1).window[1];
    const Yt = lin(0, tEnd, f.b - 10, f.t + 30);
    const amp = (f.b - f.t) / rs.length * 2.2 * (o.gain || 1) / (max || 1);
    regionBands(g, f, X, { alpha: .8 });
    const yt = ticks(0, tEnd / 3600, 6).map((v) => v * 3600);
    frame(g, f, ticks(lo, hi, 7), yt, X, Yt, String, (v) => (v / 3600).toFixed(0), '²³Na chemical shift (ppm)', 'trace baseline = acquisition midpoint (h)');
    ctx.save(); ctx.beginPath(); ctx.rect(f.l, f.t, f.r - f.l, f.b - f.t); ctx.clip();
    for (const r of rs) {
      const base = Yt(r.mid);
      const mark = o.mark?.[r.id];
      ctx.strokeStyle = mark ? c(mark) : c('ink-2'); ctx.lineWidth = mark ? 2 : 1;
      ctx.globalAlpha = mark ? 1 : .75;
      trace(ctx, r.x, r.x.map((_, i) => r.real[i]), X, (v) => base - v * amp, lo, hi);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    for (const r of rs) { const mark = o.mark?.[r.id]; ctx.fillStyle = mark ? c(mark) : c('muted'); ctx.font = (mark ? '700 ' : '') + '10.5px ' + c('font-ui'); ctx.fillText('#' + r.id, f.r - 30, Yt(r.mid) - 6); }
